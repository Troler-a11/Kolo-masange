<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO | PRO MESSENGER</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #00e5ff; --bg: #0a0a0c; --surface: #16161a; --bubble-me: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; overflow: hidden; height: 100vh; }
        
        .glass-header { background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #222; }
        .side-menu { transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .side-menu.active { transform: translateX(0); }
        
        .profile-banner { width: 100%; height: 160px; object-fit: cover; border-radius: 0 0 30px 30px; }
        .profile-avatar { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--bg); margin-top: -55px; object-fit: cover; }
        
        .chat-bubble { max-width: 80%; padding: 12px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .me { background: var(--bubble-me); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
        .them { background: #26262c; color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }

        .kolo-input { background: #1c1c22; border-radius: 18px; padding: 14px 20px; outline: none; border: 1px solid #333; transition: 0.3s; }
        .kolo-input:focus { border-color: var(--accent); }

        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Tab animation */
        .tab-active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div id="side-menu" class="fixed inset-0 z-[1000] side-menu">
        <div class="absolute inset-0 bg-black/60" onclick="toggleMenu()"></div>
        <div class="relative w-4/5 h-full bg-[#111] p-6 space-y-8">
            <div class="flex items-center gap-4 border-b border-white/5 pb-6" onclick="togglePage('profile')">
                <img id="menu-avatar" class="w-14 h-14 rounded-full object-cover">
                <div>
                    <h3 id="menu-name" class="font-bold text-lg"></h3>
                    <p id="menu-nick" class="text-xs text-gray-500"></p>
                </div>
            </div>
            <nav class="space-y-6">
                <button class="flex items-center gap-4 w-full text-left font-semibold text-gray-300"><span>👤</span> Профіль</button>
                <button class="flex items-center gap-4 w-full text-left font-semibold text-gray-300"><span>⚙️</span> Налаштування</button>
                <button class="flex items-center gap-4 w-full text-left font-semibold text-gray-300"><span>💾</span> Збережене</button>
                <button onclick="logout()" class="flex items-center gap-4 w-full text-left font-semibold text-red-500"><span>🚪</span> Вийти</button>
            </nav>
        </div>
    </div>

    <div id="main-view" class="h-full flex flex-col">
        <header class="p-5 glass-header flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="text-2xl">☰</button>
                <h1 class="text-xl font-black tracking-tighter italic">KOLO</h1>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-[10px] font-black text-green-500 uppercase">Online</span>
                <img onclick="togglePage('profile')" id="header-avatar" class="w-9 h-9 rounded-full border border-white/10 object-cover cursor-pointer">
            </div>
        </header>

        <div class="flex border-b border-white/5 overflow-x-auto no-scrollbar bg-black/40">
            <button class="px-6 py-4 text-xs font-bold uppercase tracking-widest tab-active">Всі</button>
            <button class="px-6 py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Особисті</button>
            <button class="px-6 py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Групи</button>
        </div>

        <div id="chats-list" class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar">
            </div>

        <button class="fixed bottom-24 right-6 w-14 h-14 bg-cyan-400 rounded-full flex items-center justify-center shadow-lg shadow-cyan-400/20 text-black text-2xl">✎</button>
    </div>

    <div id="profile-page" class="hidden fixed inset-0 z-[500] bg-black overflow-y-auto no-scrollbar">
        <header class="fixed top-0 inset-x-0 p-6 flex justify-between items-center z-10">
            <button onclick="togglePage('profile', false)" class="w-10 h-10 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center">←</button>
            <button class="w-10 h-10 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center">⋮</button>
        </header>

        <img id="p-banner" class="profile-banner" src="">
        <div class="flex flex-col items-center px-6">
            <img id="p-avatar" class="profile-avatar">
            <h2 id="p-name" class="text-2xl font-black mt-4 italic"></h2>
            <span class="text-cyan-400 text-xs font-bold">online</span>

            <div class="grid grid-cols-3 gap-2 w-full mt-8">
                <button class="p-4 bg-[#111] rounded-2xl flex flex-col items-center gap-2"><span>📷</span><span class="text-[8px] font-bold uppercase">Set Photo</span></button>
                <button class="p-4 bg-[#111] rounded-2xl flex flex-col items-center gap-2"><span>✏️</span><span class="text-[8px] font-bold uppercase">Edit Info</span></button>
                <button class="p-4 bg-[#111] rounded-2xl flex flex-col items-center gap-2"><span>⚙️</span><span class="text-[8px] font-bold uppercase">Settings</span></button>
            </div>

            <div class="w-full mt-6 bg-[#111] rounded-3xl p-6 space-y-6">
                <div>
                    <p id="p-phone" class="text-sm font-bold"></p>
                    <p class="text-[10px] text-gray-500 font-bold uppercase mt-1">Mobile</p>
                </div>
                <div>
                    <p id="p-nick-full" class="text-sm font-bold text-cyan-400"></p>
                    <p class="text-[10px] text-gray-500 font-bold uppercase mt-1">Username</p>
                </div>
                <div>
                    <p id="p-bday-full" class="text-sm font-bold"></p>
                    <p class="text-[10px] text-gray-500 font-bold uppercase mt-1">Birthday</p>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-window" class="hidden fixed inset-0 z-[800] bg-black flex flex-col">
        <header class="p-5 glass-header flex items-center gap-4">
            <button onclick="closeChat()" class="text-cyan-400 text-xl pr-2">←</button>
            <img id="active-chat-avatar" class="w-11 h-11 rounded-full object-cover">
            <div class="flex-1">
                <h3 id="active-chat-name" class="font-bold text-sm"></h3>
                <p class="text-[9px] text-cyan-500 font-bold uppercase animate-pulse">Online</p>
            </div>
            <button onclick="deleteChat()" class="text-[10px] text-red-500 font-black border border-red-500/30 px-3 py-2 rounded-xl uppercase">Delete Chat</button>
        </header>

        <div id="messages-area" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4 no-scrollbar"></div>

        <footer class="p-6 bg-black flex gap-3 items-center">
            <button class="w-12 h-12 bg-[#1c1c22] rounded-2xl flex items-center justify-center">📷</button>
            <input type="text" id="msg-input" placeholder="Повідомлення" class="flex-1 kolo-input font-semibold">
            <button onclick="sendMsg()" class="w-12 h-12 bg-cyan-400 rounded-2xl flex items-center justify-center text-black">➤</button>
        </footer>
    </div>

    <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 h-20 bg-black/80 backdrop-blur-2xl border-t border-white/5 flex justify-around items-center px-10">
        <button onclick="togglePage('chats')" class="text-cyan-400 flex flex-col items-center gap-1"><span class="text-xl">💬</span><span class="text-[8px] font-bold">Chats</span></button>
        <button class="text-gray-600 flex flex-col items-center gap-1"><span class="text-xl">👥</span><span class="text-[8px] font-bold">Contacts</span></button>
        <button onclick="togglePage('profile')" class="text-gray-600 flex flex-col items-center gap-1"><span class="text-xl">👤</span><span class="text-[8px] font-bold">Profile</span></button>
    </nav>

    <script>
        const KOLO_CONFIG = { databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(KOLO_CONFIG);
        const DB = firebase.database();

        let user = JSON.parse(localStorage.getItem('kolo_v2')) || null;
        let activeChat = null;

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('active'); }

        function togglePage(page, show = true) {
            if(page === 'profile') {
                document.getElementById('profile-page').classList.toggle('hidden', !show);
                if(show) loadProfile();
            }
        }

        function calculateAge(bday) {
            const birthDate = new Date(bday);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        }

        function loadProfile() {
            document.getElementById('p-avatar').src = user.avatar;
            document.getElementById('p-banner').src = user.banner || "https://images.unsplash.com/photo-1614850523296-d8c1af93d400";
            document.getElementById('p-name').innerText = user.name;
            document.getElementById('p-phone').innerText = user.phone;
            document.getElementById('p-nick-full').innerText = "@" + user.nick;
            
            const age = calculateAge(user.bday || "2000-01-01");
            const dateStr = new Date(user.bday).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('p-bday-full').innerText = `${dateStr} (${age} years old)`;
        }

        function openChat(targetNick, targetAvatar, targetName) {
            activeChat = targetNick;
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('active-chat-avatar').src = targetAvatar;
            document.getElementById('active-chat-name').innerText = targetName;
            
            const chatId = [user.nick, targetNick].sort().join('_');
            DB.ref('kolo_msgs/' + chatId).on('value', snap => {
                const area = document.getElementById('messages-area');
                area.innerHTML = '';
                if(snap.val()) {
                    Object.values(snap.val()).forEach(m => {
                        const isMe = m.sender === user.nick;
                        area.innerHTML += `<div class="chat-bubble ${isMe ? 'me' : 'them'} animate-ui">${m.text}</div>`;
                    });
                }
                area.scrollTop = area.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if(!input.value.trim()) return;
            const chatId = [user.nick, activeChat].sort().join('_');
            DB.ref('kolo_msgs/' + chatId).push({ sender: user.nick, text: input.value, time: Date.now() });
            input.value = '';
        }

        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }

        function deleteChat() {
            if(confirm("Видалити цей чат для обох сторін?")) {
                const chatId = [user.nick, activeChat].sort().join('_');
                DB.ref('kolo_msgs/' + chatId).remove();
                closeChat();
            }
        }

        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            if(user) {
                document.getElementById('header-avatar').src = user.avatar;
                document.getElementById('menu-avatar').src = user.avatar;
                document.getElementById('menu-name').innerText = user.name;
                document.getElementById('menu-nick').innerText = "@" + user.nick;

                // Test Chat Item
                document.getElementById('chats-list').innerHTML = `
                    <div onclick="openChat('kaisenj', 'https://api.dicebear.com/7.x/bottts/svg?seed=bot', 'Kaisen Core')" class="p-4 bg-[#111] rounded-3xl flex items-center gap-4 active:scale-95 transition-all">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=bot" class="w-14 h-14 rounded-full border border-white/5">
                        <div class="flex-1">
                            <h4 class="font-bold">Kaisen Core</h4>
                            <p class="text-xs text-cyan-400 font-medium">Привіт, як справи?</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-gray-600 font-bold uppercase">21:20</p>
                            <span class="inline-block w-2 h-2 bg-cyan-400 rounded-full mt-1"></span>
                        </div>
                    </div>
                `;
            } else { location.reload(); }
        };
    </script>
</body>
</html>
