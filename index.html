<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KOLO | PRO MAX</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #00e5ff; --bg: #000; --surface: #111; --bubble-me: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; height: 100vh; position: fixed; width: 100%; }
        
        /* Fix: Інтерфейс більше не вилазить */
        .safe-area { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        .content-scroll { flex: 1; overflow-y: auto; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .side-menu { transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; }
        .side-menu.active { transform: translateX(0); }

        .profile-banner { width: 100%; height: 200px; object-fit: cover; border-radius: 0 0 40px 40px; background: #222; }
        .profile-avatar { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--bg); margin-top: -55px; object-fit: cover; background: #333; transition: 0.3s; }
        
        /* Кружечки (Video Notes) */
        .video-note { width: 200px; height: 200px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); background: #000; position: relative; }

        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
        .me { background: var(--bubble-me); color: black; align-self: flex-end; border-bottom-right-radius: 4px; }
        .them { background: #1c1c1e; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }

        .nav-bar { height: 85px; background: rgba(10,10,10,0.9); backdrop-filter: blur(20px); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; }
        .input-field { background: #161618; border: 1px solid #222; border-radius: 15px; padding: 14px; width: 100%; color: white; outline: none; }
        
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.2s ease-out; }
    </style>
</head>
<body>

    <div class="safe-area">
        <header class="p-5 flex justify-between items-center bg-black/50 backdrop-blur-md z-50">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="text-2xl">☰</button>
                <h2 class="text-2xl font-black italic tracking-tighter">KOLO</h2>
            </div>
            <button onclick="toggleSearch(true)" class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center">🔍</button>
        </header>

        <div id="main-content" class="content-scroll no-scrollbar">
            <div class="flex gap-4 p-4 overflow-x-auto no-scrollbar border-b border-white/5">
                <div onclick="addStory()" class="flex flex-col items-center gap-1 shrink-0">
                    <div class="w-[65px] h-[65px] rounded-full border-2 border-dashed border-gray-600 flex items-center justify-center">
                        <span class="text-2xl">+</span>
                    </div>
                    <span class="text-[10px] font-bold text-gray-500 text-center">Story</span>
                </div>
                <div id="stories-container" class="flex gap-4"></div>
            </div>

            <div id="chats-list" class="p-4 space-y-2"></div>
        </div>

        <nav class="nav-bar">
            <button onclick="showSection('chats')" class="flex flex-col items-center gap-1 text-cyan-400">
                <span class="text-2xl">💬</span><span class="text-[9px] font-black">CHATS</span>
            </button>
            <button onclick="showSection('contacts')" class="flex flex-col items-center gap-1 text-gray-500">
                <span class="text-2xl">👥</span><span class="text-[9px] font-black">PEOPLE</span>
            </button>
            <button onclick="togglePage('profile', true)" class="flex flex-col items-center gap-1 text-gray-500">
                <span class="text-2xl">👤</span><span class="text-[9px] font-black">PROFILE</span>
            </button>
        </nav>
    </div>

    <div id="side-menu" class="fixed inset-0 side-menu">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleMenu()"></div>
        <div class="relative w-[280px] h-full bg-[#0a0a0a] p-6 flex flex-col">
            <div class="flex flex-col gap-3 mb-8 pb-6 border-b border-white/5">
                <img id="menu-avatar" class="w-14 h-14 rounded-full object-cover border-2 border-cyan-400">
                <h3 id="menu-name" class="font-black text-lg truncate"></h3>
            </div>
            <div class="space-y-6 flex-1">
                <button onclick="togglePage('profile', true); toggleMenu()" class="flex items-center gap-4 w-full font-bold">👤 Профіль</button>
                <button onclick="toggleSettings(true); toggleMenu()" class="flex items-center gap-4 w-full font-bold">⚙️ Налаштування</button>
            </div>
            <button onclick="logout()" class="p-4 bg-red-500/10 text-red-500 rounded-2xl font-black text-sm">ВИЙТИ З АКАУНТУ</button>
        </div>
    </div>

    <div id="chat-window" class="hidden fixed inset-0 z-[2500] bg-black flex flex-col">
        <header class="p-5 border-b border-white/5 flex items-center gap-4">
            <button onclick="closeChat()" class="text-2xl">←</button>
            <img id="chat-head-av" class="w-10 h-10 rounded-full object-cover">
            <div class="flex-1"><h3 id="chat-head-name" class="font-black text-sm truncate"></h3><p class="text-[9px] text-cyan-400 font-bold">ONLINE</p></div>
        </header>
        <div id="messages-area" class="flex-1 overflow-y-auto p-5 flex flex-col no-scrollbar bg-[url('https://i.ibb.co/hV4X9v6/bg.png')] bg-repeat"></div>
        <footer class="p-4 bg-black/80 backdrop-blur-md flex items-end gap-3">
            <button onmousedown="startCircle()" onmouseup="stopCircle()" class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center text-xl">🔘</button>
            <textarea id="msg-input" placeholder="Повідомлення..." class="flex-1 bg-[#161618] rounded-2xl p-3 text-sm outline-none resize-none max-h-32" rows="1"></textarea>
            <button onclick="sendMsg()" class="w-12 h-12 bg-cyan-400 rounded-2xl flex items-center justify-center text-black">➤</button>
        </footer>
    </div>

    <div id="profile-page" class="hidden fixed inset-0 z-[3000] bg-black overflow-y-auto no-scrollbar">
        <button onclick="togglePage('profile', false)" class="fixed top-6 left-6 z-[3001] w-10 h-10 bg-black/50 rounded-full flex items-center justify-center backdrop-blur-md">←</button>
        <div class="relative">
            <img id="p-banner" class="profile-banner">
            <button onclick="document.getElementById('file-banner').click()" class="absolute bottom-4 right-4 w-10 h-10 bg-black/60 rounded-full flex items-center justify-center">📷</button>
        </div>
        <div class="flex flex-col items-center px-6 -mt-[55px]">
            <div class="relative">
                <img id="p-avatar" class="profile-avatar">
                <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-1 right-1 w-8 h-8 bg-cyan-400 rounded-full flex items-center justify-center text-black">✎</button>
            </div>
            
            <div class="w-full mt-8 space-y-4">
                <input type="text" id="edit-name" class="input-field text-center font-black text-xl" placeholder="Твоє ім'я">
                <div class="p-5 bg-[#111] rounded-[30px] space-y-6">
                    <div><p class="text-[9px] text-gray-500 font-black mb-2 uppercase">Біографія</p><textarea id="edit-bio" class="w-full bg-transparent border-b border-white/10 outline-none text-sm font-semibold"></textarea></div>
                    <div><p class="text-[9px] text-gray-500 font-black mb-2 uppercase">Дата народження</p><input type="date" id="edit-bday" class="w-full bg-transparent outline-none font-bold"></div>
                </div>
                <button onclick="saveProfile()" class="btn-primary">ЗБЕРЕГТИ ЗМІНИ</button>
            </div>
        </div>
        <input type="file" id="file-banner" class="hidden" onchange="uploadMedia(this, 'banner')">
        <input type="file" id="file-avatar" class="hidden" onchange="uploadMedia(this, 'avatar')">
    </div>

    <script>
        const KOLO_CONFIG = { databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(KOLO_CONFIG);
        const DB = firebase.database();

        let state = { user: JSON.parse(localStorage.getItem('kolo_v2')), activeChat: null };

        // Real-time listener for user data
        function syncUser() {
            if(!state.user) return;
            DB.ref('kolo_users/' + state.user.nick).on('value', s => {
                if(s.val()) {
                    state.user = s.val();
                    localStorage.setItem('kolo_v2', JSON.stringify(state.user));
                    updateUI();
                }
            });
        }

        function updateUI() {
            const u = state.user;
            const elements = ['menu-avatar', 'p-avatar', 'menu-name', 'p-banner', 'edit-name', 'edit-bio', 'edit-bday'];
            
            document.getElementById('menu-avatar').src = u.avatar;
            document.getElementById('menu-name').innerText = u.name;
            if(document.getElementById('profile-page').style.display !== 'none') {
                document.getElementById('p-avatar').src = u.avatar;
                document.getElementById('p-banner').src = u.banner || '';
                document.getElementById('edit-name').value = u.name;
                document.getElementById('edit-bio').value = u.bio || '';
                document.getElementById('edit-bday').value = u.bday || '';
            }
        }

        async function saveProfile() {
            const updates = {
                name: document.getElementById('edit-name').value,
                bio: document.getElementById('edit-bio').value,
                bday: document.getElementById('edit-bday').value
            };
            await DB.ref('kolo_users/' + state.user.nick).update(updates);
            alert("Дані оновлено!");
        }

        function uploadMedia(input, type) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async () => {
                await DB.ref('kolo_users/' + state.user.nick).update({ [type]: reader.result });
            };
            reader.readAsDataURL(file);
        }

        function openChat(nick, av, name) {
            state.activeChat = nick;
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('chat-head-av').src = av;
            document.getElementById('chat-head-name').innerText = name;
            
            const cid = [state.user.nick, nick].sort().join('_');
            DB.ref('kolo_msgs/' + cid).off();
            DB.ref('kolo_msgs/' + cid).on('value', s => {
                const area = document.getElementById('messages-area'); area.innerHTML = '';
                if(s.val()) Object.values(s.val()).forEach(m => {
                    area.innerHTML += `<div class="chat-bubble ${m.sender === state.user.nick ? 'me' : 'them'} animate-pop">${m.text}</div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        function sendMsg() {
            const i = document.getElementById('msg-input');
            if(!i.value.trim()) return;
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            DB.ref('kolo_msgs/' + cid).push({ sender: state.user.nick, text: i.value, time: Date.now() });
            DB.ref(`kolo_chats/${state.user.nick}/${state.activeChat}`).set({ last: i.value, time: Date.now() });
            DB.ref(`kolo_chats/${state.activeChat}/${state.user.nick}`).set({ last: i.value, time: Date.now() });
            i.value = '';
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('active'); }
        function togglePage(p, s) { 
            document.getElementById(p+'-page').classList.toggle('hidden', !s); 
            if(s) updateUI();
        }
        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }
        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            if(state.user) {
                document.getElementById('auth-screen')?.classList.add('hidden');
                syncUser();
                loadChatList();
            }
        };

        function loadChatList() {
            DB.ref(`kolo_chats/${state.user.nick}`).on('value', async snap => {
                const list = document.getElementById('chats-list'); list.innerHTML = '';
                if(!snap.val()) return;
                const keys = Object.keys(snap.val()).sort((a,b) => snap.val()[b].time - snap.val()[a].time);
                for(let nick of keys) {
                    const u = (await DB.ref('kolo_users/'+nick).once('value')).val();
                    list.innerHTML += `
                        <div onclick="openChat('${u.nick}','${u.avatar}','${u.name}')" class="flex items-center gap-4 p-4 bg-[#111] rounded-[24px] active:scale-95 transition-all">
                            <img src="${u.avatar}" class="w-14 h-14 rounded-full object-cover">
                            <div class="flex-1 overflow-hidden">
                                <h4 class="font-bold truncate">${u.name}</h4>
                                <p class="text-xs text-gray-500 truncate">${snap.val()[nick].last}</p>
                            </div>
                        </div>`;
                }
            });
        }
    </script>
</body>
</html>
