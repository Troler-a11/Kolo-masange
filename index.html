<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO | ULTIMATE FULL VERSION 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --accent: #00e5ff; 
            --bg: #000; 
            --surface: #111; 
            --text: #fff; 
            --bubble-me: var(--accent);
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s, color 0.3s;
        }

        /* UI ELEMENTS */
        .side-menu { transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        .side-menu.active { transform: translateX(0); }
        
        .chat-bubble { max-width: 80%; padding: 14px 20px; border-radius: 22px; font-size: 14px; font-weight: 600; margin-bottom: 8px; position: relative; word-wrap: break-word; }
        .me { background: var(--bubble-me); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
        .them { background: var(--surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }

        .video-note { width: 250px; height: 250px; border-radius: 50%; overflow: hidden; border: 4px solid var(--accent); background: #000; flex-shrink: 0; margin: 10px 0; position: relative; box-shadow: 0 0 20px var(--accent); }
        .video-note video { width: 100%; height: 100%; object-fit: cover; }

        .rec-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-blur: 10px; }
        .rec-circle-container { width: 300px; height: 300px; border-radius: 50%; border: 6px solid var(--accent); overflow: hidden; margin-bottom: 30px; position: relative; }
        .rec-circle-container video { width: 100%; height: 100%; object-fit: cover; }

        .story-circle { width: 72px; height: 72px; border-radius: 50%; padding: 3px; border: 2px solid var(--accent); flex-shrink: 0; cursor: pointer; transition: 0.2s; }
        .story-circle:active { scale: 0.9; }
        .story-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #222; }

        .btn-main { background: var(--accent); color: #000; font-weight: 900; border-radius: 18px; padding: 18px; width: 100%; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-main:active { scale: 0.96; opacity: 0.8; }

        .input-dark { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 16px; width: 100%; color: var(--text); outline: none; }

        /* SCROLLBARS */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .msg-del-btn { position: absolute; top: -8px; right: -8px; background: #ff3b30; color: white; width: 24px; height: 24px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 50; border: 2px solid var(--bg); font-weight: bold; font-size: 12px; }
        .chat-bubble:hover .msg-del-btn, .video-note:hover .msg-del-btn { display: flex; }

        /* THEME PICKER */
        .color-node { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; transition: 0.2s; }
        .color-node:hover { scale: 1.1; }

        /* OFFLINE STATUS */
        #offline-indicator { display: none; background: #ff9500; color: #000; text-align: center; font-size: 10px; font-weight: 900; padding: 2px; }
    </style>
</head>
<body class="bg-black text-white">

    <div id="offline-indicator">ВІДСУТНІЙ ІНТЕРНЕТ - РЕЖИМ ОЧІКУВАННЯ</div>

        <h2 class="text-white font-black mb-4">ЗАПИС КРУЖЕЧКА</h2>
        <div class="rec-circle-container">
            <video id="rec-preview" autoplay muted playsinline></video>
        </div>
        <div class="flex gap-6 w-full px-10">
            <button onclick="cancelRecording()" class="flex-1 p-4 bg-zinc-800 rounded-2xl font-bold">СКАСУВАТИ</button>
            <button onclick="finishRecording()" class="flex-1 p-4 bg-white text-black rounded-2xl font-black">ВІДПРАВИТИ</button>
        </div>
    </div>

            <p class="text-gray-500 font-bold text-sm mb-10">ТВІЙ ПРОСТІР. ТВОЇ ПРАВИЛА.</p>
            <input type="tel" id="auth-phone" placeholder="0XXXXXXXXX" class="input-dark text-center text-2xl font-bold">
            <button onclick="handleAuthSubmit()" class="btn-main">ПРОДОВЖИТИ</button>

        <div id="reg-details" class="hidden space-y-4 max-w-md mx-auto w-full">

        <div id="otp-view" class="hidden space-y-8 text-center max-w-md mx-auto w-full">
            <h2 class="text-3xl font-black italic">ВВЕДИ КОД</h2>
            <input type="text" id="otp-input" maxlength="6" class="w-full text-center text-6xl font-black bg-transparent border-b-4 border-cyan-400 outline-none text-cyan-400 tracking-[10px]">
            <button onclick="verifySession()" class="btn-main">ПІДТВЕРДИТИ</button>

    <div id="requests-panel" class="hidden fixed inset-0 z-[1900] bg-black p-8">
        <button onclick="togglePage('requests', false)" class="text-2xl mb-8">← НАЗАД</button>
        <h2 class="text-3xl font-black italic mb-6">ЗАПИТИ В ДРУЗІ</h2>
        <div id="req-list" class="space-y-4"></div>
    </div>

    <script>
        const CONFIG = { databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(CONFIG);
        const DB = firebase.database();
        emailjs.init("KErbU8_xE37eaf0qi");

        let state = {
            user: JSON.parse(localStorage.getItem('kolo_v2')),
            activeChat: null,
            mediaRecorder: null,
            chunks: [],
            isRecording: false,
            stories: [],
            storyIdx: 0,
            storyTimer: null,
            isDark: true,
            online: navigator.onLine
        };

        // --- UTILS ---
        const formatPhone = (p) => {
            let clean = p.replace(/\D/g, '');
            if (clean.startsWith('0')) clean = '38' + clean;
            if (!clean.startsWith('38')) clean = '38' + clean;
            return '+' + clean;
        };

        function calculateAge(bday) {
            if(!bday) return "";
            const diff = Date.now() - new Date(bday).getTime();
            return `${Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25))} р.`;
        }

        // --- OFFLINE LOGIC ---
        window.addEventListener('online', () => {
            state.online = true;
            document.getElementById('offline-indicator').style.display = 'none';
            syncQueue();
        });
        window.addEventListener('offline', () => {
            state.online = false;
            document.getElementById('offline-indicator').style.display = 'block';
        });

        async function syncQueue() {
            let queue = JSON.parse(localStorage.getItem('kolo_queue') || '[]');
            for(let item of queue) {
                if(item.type === 'msg') await DB.ref('kolo_msgs/' + item.cid).push(item.data);
            }
            localStorage.setItem('kolo_queue', '[]');
        }

        // --- AUTH ---
        async function handleAuthSubmit() {
            const phone = formatPhone(document.getElementById('auth-phone').value);
            const snap = await DB.ref('kolo_users').once('value');
            let found = null;
            snap.forEach(child => { if(child.val().phone === phone) found = child.val(); });

            if(found) {
                state.temp = found;
                sendOTP('login');
            } else {
                document.getElementById('auth-init').classList.add('hidden');
                document.getElementById('reg-details').classList.remove('hidden');
            }
        }

        function sendOTP(m) {
            const email = m === 'login' ? state.temp.email : document.getElementById('reg-email').value;
            state.otp = Math.floor(100000 + Math.random() * 900000).toString();
            emailjs.send('service_dbkrnz9', 'template_n90xvc9', { to_email: email, otp_code: state.otp }).then(() => {
                document.getElementById('auth-init').classList.add('hidden');
                document.getElementById('reg-details').classList.add('hidden');
                document.getElementById('otp-view').classList.remove('hidden');
            });
        }

        async function verifySession() {
            if(document.getElementById('otp-input').value === state.otp) {
                if(!state.temp) {
                    const u = {
                        name: document.getElementById('reg-name').value,
                        nick: document.getElementById('reg-nick').value.replace('@',''),
                        email: document.getElementById('reg-email').value,
                        phone: formatPhone(document.getElementById('auth-phone').value),
                        bday: document.getElementById('reg-bday').value,
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${Date.now()}`,
                        friends: {},
                        theme: '#00e5ff',
                        isDark: true
                    };
                    await DB.ref('kolo_users/' + u.nick).set(u);
                    state.user = u;
                } else state.user = state.temp;
                localStorage.setItem('kolo_v2', JSON.stringify(state.user));
                location.reload();
            }
        }

        // --- CHAT & MESSAGES ---
        function openChat(nick, av, name) {
            state.activeChat = nick;
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('chat-head-av').src = av;
            document.getElementById('chat-head-name').innerText = name;
            
            const cid = [state.user.nick, nick].sort().join('_');
            DB.ref('kolo_msgs/'+cid).off();
            DB.ref('kolo_msgs/'+cid).on('value', s => {
                const area = document.getElementById('messages-area');
                area.innerHTML = '';
                if(s.val()) {
                    Object.entries(s.val()).forEach(([id, m]) => {
                        const isMe = m.sender === state.user.nick;
                        let body = m.text;
                        if(m.type === 'circle') body = `<video src="${m.text}" autoplay loop muted playsinline class="w-full h-full"></video>`;
                        else if(m.type === 'img') body = `<img src="${m.text}" class="rounded-xl">`;

                        const typeCls = m.type === 'circle' ? 'video-note' : 'chat-bubble';
                        area.innerHTML += `
                            <div class="${isMe ? 'self-end' : 'self-start'} ${typeCls} ${isMe ? 'me' : 'them'}">
                                ${body}
                                <button class="msg-del-btn" onclick="deleteMsg('${id}')">×</button>
                            </div>
                        `;
                    });
                }
                area.scrollTop = area.scrollHeight;
            });
        }

        async function sendMsg() {
            const i = document.getElementById('msg-input');
            if(!i.value.trim()) return;
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            const data = { sender: state.user.nick, text: i.value, type: 'text', time: Date.now() };
            
            if(state.online) {
                await DB.ref('kolo_msgs/'+cid).push(data);
                DB.ref(`kolo_chats/${state.user.nick}/${state.activeChat}`).set({ last: i.value, time: Date.now() });
                DB.ref(`kolo_chats/${state.activeChat}/${state.user.nick}`).set({ last: i.value, time: Date.now() });
            } else {
                let queue = JSON.parse(localStorage.getItem('kolo_queue') || '[]');
                queue.push({ type: 'msg', cid, data });
                localStorage.setItem('kolo_queue', JSON.stringify(queue));
            }
            i.value = '';
        }

        async function deleteMsg(id) {
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            await DB.ref(`kolo_msgs/${cid}/${id}`).remove();
        }

        // --- CIRCLES (CENTERED) ---
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
                document.getElementById('rec-preview').srcObject = stream;
                document.getElementById('rec-ui').style.display = 'flex';
                state.mediaRecorder = new MediaRecorder(stream);
                state.chunks = [];
                state.mediaRecorder.ondataavailable = e => state.chunks.push(e.data);
                state.mediaRecorder.start();
            } catch(e) { alert("Потрібен доступ до камери!"); }
        }

        function cancelRecording() {
            state.mediaRecorder.stop();
            document.getElementById('rec-preview').srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('rec-ui').style.display = 'none';
        }

        function finishRecording() {
            state.mediaRecorder.onstop = async () => {
                const blob = new Blob(state.chunks, { type: 'video/mp4' });
                const reader = new FileReader();
                reader.onload = () => sendMedia(reader.result, 'circle');
                reader.readAsDataURL(blob);
                document.getElementById('rec-preview').srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('rec-ui').style.display = 'none';
            };
            state.mediaRecorder.stop();
        }

        async function sendMedia(data, type) {
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            await DB.ref('kolo_msgs/'+cid).push({ sender: state.user.nick, text: data, type: type, time: Date.now() });
        }

        // --- FRIENDS & REQUESTS ---
        async function viewForeignProfile(nick) {
            if(nick === state.user.nick) return viewMyProfile();
            togglePage('profile', true);
            const snap = await DB.ref('kolo_users/'+nick).once('value');
            const u = snap.val();
            document.getElementById('p-edit-btn').classList.add('hidden');
            document.getElementById('p-friend-status').classList.remove('hidden');
            
            const isFriend = state.user.friends && state.user.friends[nick];
            const btn = document.getElementById('btn-friend-action');
            btn.innerText = isFriend ? "ВИДАЛИТИ З ДРУЗІВ" : "ВІДПРАВИТИ ЗАПИТ";
            btn.onclick = () => isFriend ? removeFriend(nick) : sendRequest(nick);
            
            renderProfile(u);
        }

        async function sendRequest(nick) {
            await DB.ref(`kolo_requests/${nick}/${state.user.nick}`).set({
                from: state.user.nick,
                name: state.user.name,
                av: state.user.avatar
            });
            alert("Запит відправлено!");
        }

        async function acceptFriend(fromNick) {
            await DB.ref(`kolo_users/${state.user.nick}/friends/${fromNick}`).set(true);
            await DB.ref(`kolo_users/${fromNick}/friends/${state.user.nick}`).set(true);
            await DB.ref(`kolo_requests/${state.user.nick}/${fromNick}`).remove();
            state.user.friends = state.user.friends || {};
            state.user.friends[fromNick] = true;
            localStorage.setItem('kolo_v2', JSON.stringify(state.user));
            showRequests();
        }

        // --- THEMES & CUSTOMIZATION ---
        function applyTheme(color) {
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--bubble-me', color);
            state.user.theme = color;
            localStorage.setItem('kolo_v2', JSON.stringify(state.user));
            if(state.online) DB.ref(`kolo_users/${state.user.nick}`).update({ theme: color });
        }

        function toggleLightMode(isLight) {
            const bg = isLight ? '#f4f4f4' : '#000';
            const text = isLight ? '#000' : '#fff';
            const surface = isLight ? '#fff' : '#111';
            document.documentElement.style.setProperty('--bg', bg);
            document.documentElement.style.setProperty('--text', text);
            document.documentElement.style.setProperty('--surface', surface);
            state.user.isDark = !isLight;
            localStorage.setItem('kolo_v2', JSON.stringify(state.user));
        }

        // --- UI NAVIGATION ---
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('active'); }
        function togglePage(p, s) { document.getElementById(p+'-page').classList.toggle('hidden', !s); }
        function showRequests() {
            togglePage('requests', true);
            DB.ref(`kolo_requests/${state.user.nick}`).once('value', snap => {
                const list = document.getElementById('req-list');
                list.innerHTML = '';
                if(!snap.val()) list.innerHTML = '<p class="text-zinc-500 font-bold">Немає нових запитів</p>';
                else {
                    Object.values(snap.val()).forEach(r => {
                        list.innerHTML += `
                            <div class="flex items-center gap-4 p-4 bg-zinc-900 rounded-3xl">
                                <img src="${r.av}" class="w-12 h-12 rounded-full">
                                <div class="flex-1 font-black">${r.name}</div>
                                <button onclick="acceptFriend('${r.from}')" class="bg-cyan-400 text-black px-4 py-2 rounded-xl font-black">OK</button>
                            </div>
                        `;
                    });
                }
            });
        }

        function viewMyProfile() {
            togglePage('profile', true);
            document.getElementById('p-edit-btn').classList.remove('hidden');
            document.getElementById('p-friend-status').classList.add('hidden');
            renderProfile(state.user);
        }

        function renderProfile(u) {
            document.getElementById('p-avatar').src = u.avatar;
            document.getElementById('p-name-input').value = u.name;
            document.getElementById('p-nick-full').innerText = "@" + u.nick;
            document.getElementById('p-phone').innerText = u.phone;
            document.getElementById('p-bio-input').value = u.bio || "";
            document.getElementById('p-bday-input').value = u.bday || "";
            document.getElementById('p-age-calc').innerText = calculateAge(u.bday);
        }

        async function updateInfo(field, val) {
            await DB.ref(`kolo_users/${state.user.nick}`).update({ [field]: val });
            state.user[field] = val;
            localStorage.setItem('kolo_v2', JSON.stringify(state.user));
        }

        function toggleSearch(s) {
            document.getElementById('search-panel').classList.toggle('hidden', !s);
            if(s) document.getElementById('search-input').focus();
        }

        document.getElementById('search-input').oninput = async (e) => {
            const v = e.target.value.toLowerCase();
            if(v.length < 2) return;
            const snap = await DB.ref('kolo_users').once('value');
            const res = document.getElementById('search-results');
            res.innerHTML = '';
            snap.forEach(child => {
                const u = child.val();
                if(u.nick.toLowerCase().includes(v) && u.nick !== state.user.nick) {
                    res.innerHTML += `
                        <div onclick="viewForeignProfile('${u.nick}')" class="flex gap-4 items-center p-4 bg-zinc-900 rounded-[25px]">
                            <img src="${u.avatar}" class="w-12 h-12 rounded-full">
                            <div><p class="font-black">${u.name}</p><p class="text-xs text-cyan-400">@${u.nick}</p></div>
                        </div>
                    `;
                }
            });
        };

        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }
        function showThemeSettings() { togglePage('theme', true); }
        function logout() { localStorage.clear(); location.reload(); }

        // --- STORIES ---
        function uploadStory(input) {
            const reader = new FileReader();
            reader.onload = async () => {
                await DB.ref('kolo_stories/' + state.user.nick).push({
                    img: reader.result, time: Date.now()
                });
                alert("Історію додано!");
            };
            reader.readAsDataURL(input.files[0]);
        }

        async function openUserStories(nick) {
            const snap = await DB.ref('kolo_stories/'+nick).once('value');
            const uSnap = await DB.ref('kolo_users/'+nick).once('value');
            if(!snap.val()) return;
            state.stories = Object.values(snap.val());
            state.storyIdx = 0;
            state.storyUser = uSnap.val();
            showStory();
        }

        function showStory() {
            const s = state.stories[state.storyIdx];
            document.getElementById('sv-img').src = s.img;
            document.getElementById('sv-av').src = state.storyUser.avatar;
            document.getElementById('sv-name').innerText = state.storyUser.name;
            document.getElementById('story-viewer').classList.remove('hidden');
            
            const bars = document.getElementById('story-progress-container');
            bars.innerHTML = '';
            state.stories.forEach((_, i) => {
                bars.innerHTML += `<div class="h-1 flex-1 bg-white/30 rounded-full overflow-hidden">
                    <div class="h-full bg-white transition-all duration-[5000ms] ease-linear" style="width: ${i < state.storyIdx ? '100%' : (i === state.storyIdx ? '0%' : '0%')}"></div>
                </div>`;
            });
        }

        function handleStoryNav(e) {
            if(e.clientX > window.innerWidth / 2) {
                state.storyIdx++;
                if(state.storyIdx >= state.stories.length) closeStory();
                else showStory();
            } else {
                state.storyIdx = Math.max(0, state.storyIdx - 1);
                showStory();
            }
        }

        function closeStory() { document.getElementById('story-viewer').classList.add('hidden'); }

        // --- ON LOAD ---
        window.onload = () => {
            if(state.user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                document.getElementById('menu-name').innerText = state.user.name;
                document.getElementById('menu-nick').innerText = "@" + state.user.nick;
                document.getElementById('menu-avatar').src = state.user.avatar;
                
                if(state.user.theme) applyTheme(state.user.theme);
                if(state.user.isDark === false) {
                    document.getElementById('theme-toggle').checked = true;
                    toggleLightMode(true);
                }

                // Listen Stories
                DB.ref('kolo_stories').on('value', snap => {
                    const list = document.getElementById('stories-list');
                    list.innerHTML = '';
                    snap.forEach(child => {
                        DB.ref('kolo_users/'+child.key).once('value', u => {
                            const ud = u.val();
                            list.innerHTML += `<div class="flex flex-col items-center gap-2" onclick="openUserStories('${child.key}')">
                                <div class="story-circle"><img src="${ud.avatar}" class="story-img"></div>
                                <span class="text-[9px] font-black uppercase">${ud.name.split(' ')[0]}</span>
                            </div>`;
                        });
                    });
                });

                // Listen Chats
                DB.ref(`kolo_chats/${state.user.nick}`).on('value', async snap => {
                    const list = document.getElementById('chats-list');
                    list.innerHTML = '';
                    if(!snap.val()) list.innerHTML = '<div class="text-center text-zinc-600 mt-20">Немає чатів</div>';
                    for(let nick in snap.val()) {
                        const uSnap = await DB.ref('kolo_users/'+nick).once('value');
                        const u = uSnap.val();
                        list.innerHTML += `
                            <div onclick="openChat('${u.nick}','${u.avatar}','${u.name}')" class="flex items-center gap-4 p-5 bg-zinc-900/40 rounded-[30px] border border-white/5 active:scale-95 transition">
                                <img src="${u.avatar}" class="w-16 h-16 rounded-full object-cover">
                                <div class="flex-1 overflow-hidden">
                                    <h4 class="font-black text-lg">${u.name}</h4>
                                    <p class="text-sm text-zinc-500 truncate">${snap.val()[nick].last}</p>
                                </div>
                            </div>
                        `;
                    }
                });

                // Listen Requests Badge
                DB.ref(`kolo_requests/${state.user.nick}`).on('value', snap => {
                    const b = document.getElementById('req-badge');
                    if(snap.val()) {
                        const count = Object.keys(snap.val()).length;
                        b.innerText = count;
                        b.classList.remove('hidden');
                    } else b.classList.add('hidden');
                });
            }
        };
    </script>
</body>
</html>
