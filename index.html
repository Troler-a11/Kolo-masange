<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO | ULTIMATE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #00e5ff; --bg: #000; --surface: #111; --text: #fff; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; transition: 0.3s; }
        
        .side-menu { transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        .side-menu.active { transform: translateX(0); }
        
        .chat-bubble { max-width: 80%; padding: 12px 18px; border-radius: 22px; font-size: 14px; font-weight: 600; margin-bottom: 8px; position: relative; }
        .me { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
        .them { background: var(--surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; }

        .video-note { width: 220px; height: 220px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); background: #000; flex-shrink: 0; margin-bottom: 10px; position: relative; }
        .video-note video { width: 100%; height: 100%; object-fit: cover; }

        .rec-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .rec-circle { width: 280px; height: 280px; border-radius: 50%; border: 5px solid var(--accent); overflow: hidden; margin-bottom: 20px; }

        .story-circle { width: 68px; height: 68px; border-radius: 50%; padding: 3px; border: 2px solid var(--accent); flex-shrink: 0; }
        .story-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .btn-send-circle { background: var(--accent); color: #000; padding: 15px 40px; border-radius: 50px; font-weight: 900; margin-top: 20px; }

        .msg-del-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; display: none; align-items: center; justify-content: center; z-index: 20; }
        .chat-bubble:hover .msg-del-btn, .video-note:hover .msg-del-btn { display: flex; }

        .theme-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="rec-ui" class="rec-overlay">
        <div class="rec-circle"><video id="rec-preview" autoplay muted playsinline></video></div>
        <div class="flex gap-4">
            <button onclick="stopRecording(false)" class="p-4 bg-red-600 rounded-full">СКАСУВАТИ</button>
            <button onclick="stopRecording(true)" class="btn-send-circle">ВІДПРАВИТИ</button>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[2000] bg-black p-8 flex flex-col justify-center overflow-y-auto">
        <div id="auth-init" class="space-y-6 max-w-md mx-auto w-full text-center">
            <h1 class="text-5xl font-black italic tracking-tighter mb-10">KOLO<span class="text-cyan-400">.</span></h1>
            <input type="tel" id="auth-phone" placeholder="Номер телефону" class="w-full p-4 bg-zinc-900 rounded-2xl outline-none text-center text-xl">
            <button onclick="checkUserAndSendOTP()" class="w-full p-4 bg-cyan-400 text-black font-black rounded-2xl">УВІЙТИ</button>
        </div>
        
        <div id="reg-details" class="hidden space-y-4 max-w-md mx-auto w-full text-center">
            <h2 class="text-xl font-black mb-6">СТВОРИТИ ПРОФІЛЬ</h2>
            <input type="text" id="reg-name" placeholder="Ім'я" class="w-full p-4 bg-zinc-900 rounded-2xl">
            <input type="text" id="reg-nick" placeholder="@username" class="w-full p-4 bg-zinc-900 rounded-2xl">
            <input type="email" id="reg-email" placeholder="Email для коду" class="w-full p-4 bg-zinc-900 rounded-2xl">
            <button onclick="sendOTP('new')" class="w-full p-4 bg-cyan-400 text-black font-black rounded-2xl">ОТРИМАТИ КОД</button>
        </div>

        <div id="otp-view" class="hidden space-y-8 text-center max-w-md mx-auto w-full">
            <input type="text" id="otp-input" maxlength="6" class="w-full text-center text-6xl font-black bg-transparent border-b-4 border-cyan-400 outline-none text-cyan-400 tracking-widest">
            <button onclick="verifySession()" class="w-full p-4 bg-cyan-400 text-black font-black rounded-2xl">ПІДТВЕРДИТИ</button>
        </div>
    </div>

    <div id="app-ui" class="hidden h-full flex flex-col">
        <header class="p-5 flex justify-between items-center border-b border-white/5 bg-black/50 backdrop-blur-md">
            <button onclick="toggleMenu()" class="text-2xl">☰</button>
            <h2 class="text-2xl font-black italic">KOLO</h2>
            <button onclick="toggleSearch(true)" class="text-xl">🔍</button>
        </header>

        <div class="flex gap-4 p-4 overflow-x-auto no-scrollbar border-b border-white/5">
            <div class="flex flex-col items-center gap-1" onclick="document.getElementById('file-story').click()">
                <div class="story-circle border-dashed border-zinc-700 flex items-center justify-center text-2xl">+</div>
                <span class="text-[9px] font-bold">Ваша</span>
                <input type="file" id="file-story" class="hidden" accept="image/*" onchange="uploadStory(this)">
            </div>
            <div id="stories-list" class="flex gap-4"></div>
        </div>

        <div id="chats-list" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar"></div>

        <div id="friend-requests-btn" class="hidden p-4 bg-zinc-900 mx-4 rounded-2xl mb-2 flex justify-between items-center" onclick="showRequests()">
            <span class="font-bold text-xs">НОВІ ЗАПИТИ В ДРУЗІ</span>
            <span id="requests-count" class="bg-cyan-400 text-black px-2 py-1 rounded-full text-[10px] font-black">0</span>
        </div>

        <nav class="h-20 bg-black border-t border-white/5 flex justify-around items-center">
            <button onclick="showPage('app-ui')" class="text-2xl">💬</button>
            <button onclick="viewMyProfile()" class="text-2xl">👤</button>
            <button onclick="showSettings()" class="text-2xl">⚙️</button>
        </nav>
    </div>

    <div id="chat-window" class="hidden fixed inset-0 z-[1600] bg-black flex flex-col">
        <header class="p-4 border-b border-white/5 flex items-center gap-4 bg-black">
            <button onclick="closeChat()" class="text-2xl">←</button>
            <img id="chat-head-av" class="w-10 h-10 rounded-full object-cover">
            <div class="flex-1"><h3 id="chat-head-name" class="font-black text-sm"></h3></div>
        </header>
        <div id="messages-area" class="flex-1 overflow-y-auto p-5 flex flex-col no-scrollbar"></div>
        <footer class="p-3 border-t border-white/5 flex gap-2 items-center bg-black">
            <button onclick="startRecording()" class="w-12 h-12 bg-zinc-900 rounded-full">🔘</button>
            <button onclick="document.getElementById('chat-file').click()" class="w-12 h-12 bg-zinc-900 rounded-full">📎</button>
            <input type="file" id="chat-file" class="hidden" accept="image/*" onchange="uploadChatFile(this)">
            <input type="text" id="msg-input" placeholder="Повідомлення..." class="flex-1 p-3 bg-zinc-900 rounded-2xl outline-none">
            <button onclick="sendMsg()" class="w-12 h-12 bg-cyan-400 rounded-full text-black font-black">➤</button>
        </footer>
    </div>

    <div id="settings-page" class="hidden fixed inset-0 z-[1800] bg-black p-8">
        <button onclick="togglePage('settings', false)" class="text-2xl mb-10">← НАЗАД</button>
        <h2 class="text-3xl font-black mb-6 italic">НАЛАШТУВАННЯ</h2>
        
        <div class="space-y-8">
            <div>
                <p class="font-bold mb-4 uppercase text-xs text-gray-500">Колір інтерфейсу</p>
                <div class="flex gap-4">
                    <div class="theme-dot bg-cyan-400" onclick="setTheme('#00e5ff')"></div>
                    <div class="theme-dot bg-purple-600" onclick="setTheme('#9333ea')"></div>
                    <div class="theme-dot bg-green-500" onclick="setTheme('#22c55e')"></div>
                    <div class="theme-dot bg-red-500" onclick="setTheme('#ef4444')"></div>
                    <div class="theme-dot bg-orange-500" onclick="setTheme('#f97316')"></div>
                    <input type="color" onchange="setTheme(this.value)" class="w-8 h-8 rounded-full bg-transparent border-none">
                </div>
            </div>
            
            <div class="flex justify-between items-center p-4 bg-zinc-900 rounded-2xl">
                <span class="font-bold">Темна тема</span>
                <input type="checkbox" checked onchange="toggleDark(this.checked)">
            </div>
        </div>
    </div>

    <div id="story-viewer" class="hidden fixed inset-0 z-[3000] bg-black flex flex-col">
        <div class="flex gap-1 p-2" id="story-bars"></div>
        <div class="flex justify-between p-4 items-center">
            <div class="flex items-center gap-2"><img id="st-av" class="w-8 h-8 rounded-full"><span id="st-name" class="font-bold"></span></div>
            <button onclick="closeStoryViewer()" class="text-3xl">×</button>
        </div>
        <div class="flex-1 flex items-center justify-center relative" onclick="nextStoryByClick(event)">
            <img id="st-img" class="max-w-full max-h-full object-contain">
        </div>
    </div>

    <script>
        const KOLO_CONFIG = { databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(KOLO_CONFIG);
        const DB = firebase.database();
        emailjs.init("KErbU8_xE37eaf0qi");

        let state = { 
            user: JSON.parse(localStorage.getItem('kolo_v2')), 
            activeChat: null, 
            mediaRecorder: null, 
            chunks: [],
            currentStories: [],
            storyIdx: 0,
            online: navigator.onLine
        };

        // NORMALIZING PHONE
        function formatPhone(p) {
            let clean = p.replace(/\D/g, '');
            if(clean.length === 10) clean = '38' + clean;
            if(clean.length === 12) return '+' + clean;
            return '+' + clean;
        }

        // OFFLINE SYNC
        window.addEventListener('online', () => { state.online = true; syncOfflineMsgs(); });
        window.addEventListener('offline', () => { state.online = false; });

        async function syncOfflineMsgs() {
            let offline = JSON.parse(localStorage.getItem('offline_msgs') || '[]');
            for(let m of offline) {
                await DB.ref('kolo_msgs/'+m.cid).push(m.data);
            }
            localStorage.setItem('offline_msgs', '[]');
        }

        // AUTH
        async function checkUserAndSendOTP() {
            const rawPhone = document.getElementById('auth-phone').value.trim();
            const phone = formatPhone(rawPhone);
            const snap = await DB.ref('kolo_users').once('value');
            let found = null;
            if(snap.val()) { for(let id in snap.val()) if(snap.val()[id].phone === phone) found = snap.val()[id]; }
            if(found) { state.temp = found; sendOTP('login'); }
            else { 
                document.getElementById('auth-init').classList.add('hidden'); 
                document.getElementById('reg-details').classList.remove('hidden'); 
            }
        }

        function sendOTP(m) {
            const email = m === 'login' ? state.temp.email : document.getElementById('reg-email').value;
            state.otp = Math.floor(100000 + Math.random() * 900000).toString();
            emailjs.send('service_dbkrnz9', 'template_n90xvc9', { to_email: email, otp_code: state.otp }).then(() => {
                document.getElementById('auth-init').classList.add('hidden');
                document.getElementById('reg-details').classList.add('hidden');
                document.getElementById('otp-view').classList.remove('hidden');
            });
        }

        async function verifySession() {
            if(document.getElementById('otp-input').value === state.otp) {
                if(!state.temp) {
                    const nick = document.getElementById('reg-nick').value.replace('@','');
                    const u = { 
                        name: document.getElementById('reg-name').value, 
                        nick: nick, 
                        email: document.getElementById('reg-email').value, 
                        phone: formatPhone(document.getElementById('auth-phone').value), 
                        avatar: "https://api.dicebear.com/7.x/pixel-art/svg?seed="+Date.now(),
                        friends: {},
                        theme: '#00e5ff'
                    };
                    await DB.ref('kolo_users/' + nick).set(u);
                    state.user = u;
                } else state.user = state.temp;
                localStorage.setItem('kolo_v2', JSON.stringify(state.user));
                location.reload();
            }
        }

        // CIRCLES (BIG & CENTERED)
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('rec-preview').srcObject = stream;
                document.getElementById('rec-ui').style.display = 'flex';
                state.mediaRecorder = new MediaRecorder(stream);
                state.chunks = [];
                state.mediaRecorder.ondataavailable = e => state.chunks.push(e.data);
                state.mediaRecorder.start();
            } catch(e) { alert("Дай доступ до камери!"); }
        }

        function stopRecording(send) {
            state.mediaRecorder.onstop = async () => {
                if(send) {
                    const blob = new Blob(state.chunks, { type: 'video/mp4' });
                    const reader = new FileReader();
                    reader.onload = () => sendMedia(reader.result, 'circle');
                    reader.readAsDataURL(blob);
                }
                document.getElementById('rec-preview').srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('rec-ui').style.display = 'none';
            };
            state.mediaRecorder.stop();
        }

        async function sendMedia(data, type) {
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            const msg = { sender: state.user.nick, text: data, type: type, time: Date.now() };
            if(!state.online) {
                let off = JSON.parse(localStorage.getItem('offline_msgs') || '[]');
                off.push({ cid, data: msg });
                localStorage.setItem('offline_msgs', JSON.stringify(off));
            } else {
                await DB.ref('kolo_msgs/'+cid).push(msg);
            }
        }

        // FRIEND REQUESTS
        async function sendFriendRequest(targetNick) {
            await DB.ref(`kolo_requests/${targetNick}/${state.user.nick}`).set({
                from: state.user.nick,
                name: state.user.name,
                av: state.user.avatar
            });
            alert("Запит відправлено!");
        }

        // THEMES
        function setTheme(color) {
            document.documentElement.style.setProperty('--accent', color);
            state.user.theme = color;
            localStorage.setItem('kolo_v2', JSON.stringify(state.user));
            if(state.online) DB.ref(`kolo_users/${state.user.nick}`).update({theme: color});
        }

        function toggleDark(isDark) {
            const bg = isDark ? '#000' : '#fff';
            const text = isDark ? '#fff' : '#000';
            const surface = isDark ? '#111' : '#f0f0f0';
            document.documentElement.style.setProperty('--bg', bg);
            document.documentElement.style.setProperty('--text', text);
            document.documentElement.style.setProperty('--surface', surface);
        }

        // STORIES SYSTEM (ALL STORIES)
        function uploadStory(input) {
            const reader = new FileReader();
            reader.onload = async () => {
                await DB.ref('kolo_stories/' + state.user.nick).push({
                    img: reader.result, time: Date.now()
                });
            };
            reader.readAsDataURL(input.files[0]);
        }

        async function showAllStories(nick) {
            const snap = await DB.ref('kolo_stories/'+nick).once('value');
            const userSnap = await DB.ref('kolo_users/'+nick).once('value');
            const userData = userSnap.val();
            if(!snap.val()) return;
            
            state.currentStories = Object.values(snap.val());
            state.storyIdx = 0;
            state.storyUser = userData;
            
            renderStory();
        }

        function renderStory() {
            const s = state.currentStories[state.storyIdx];
            document.getElementById('st-img').src = s.img;
            document.getElementById('st-av').src = state.storyUser.avatar;
            document.getElementById('st-name').innerText = state.storyUser.name;
            document.getElementById('story-viewer').classList.remove('hidden');
        }

        function nextStoryByClick(e) {
            if(e.clientX > window.innerWidth / 2) {
                state.storyIdx++;
                if(state.storyIdx >= state.currentStories.length) closeStoryViewer();
                else renderStory();
            } else {
                state.storyIdx--;
                if(state.storyIdx < 0) state.storyIdx = 0;
                renderStory();
            }
        }

        function closeStoryViewer() { document.getElementById('story-viewer').classList.add('hidden'); }

        // UTILS
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('active'); }
        function togglePage(p, s) { document.getElementById(p+'-page').classList.toggle('hidden', !s); }
        function showSettings() { togglePage('settings', true); }
        function closeChat() { document.getElementById('chat-window').classList.add('hidden'); }
        function viewMyProfile() { togglePage('profile', true); renderProfile(state.user); }

        function renderProfile(u) {
            document.getElementById('p-avatar').src = u.avatar;
            document.getElementById('p-name-input').value = u.name;
            document.getElementById('p-nick-full').innerText = "@" + u.nick;
            document.getElementById('p-phone').innerText = u.phone; // Має бути +380...
        }

        window.onload = () => {
            if(state.user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                if(state.user.theme) setTheme(state.user.theme);
                
                // Слухаємо нові історії
                DB.ref('kolo_stories').on('value', snap => {
                    const list = document.getElementById('stories-list'); list.innerHTML = '';
                    for(let nick in snap.val()) {
                        DB.ref('kolo_users/'+nick).once('value', u => {
                            const ud = u.val();
                            list.innerHTML += `<div class="story-circle" onclick="showAllStories('${nick}')"><img src="${ud.avatar}" class="story-img"></div>`;
                        });
                    }
                });

                // Слухаємо запити в друзі
                DB.ref(`kolo_requests/${state.user.nick}`).on('value', snap => {
                    const btn = document.getElementById('friend-requests-btn');
                    if(snap.val()) {
                        btn.classList.remove('hidden');
                        document.getElementById('requests-count').innerText = Object.keys(snap.val()).length;
                    } else {
                        btn.classList.add('hidden');
                    }
                });
            }
        };

        // ТУТ БУДЕ ІНШИЙ КОД ЯКИЙ ТИ НЕ ХОТІВ ВИДАЛЯТИ
        function sendMsg() {
            const i = document.getElementById('msg-input'); if(!i.value.trim()) return;
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            const m = { sender: state.user.nick, text: i.value, type: 'text', time: Date.now() };
            if(!state.online) {
                let off = JSON.parse(localStorage.getItem('offline_msgs') || '[]');
                off.push({ cid, data: m });
                localStorage.setItem('offline_msgs', JSON.stringify(off));
            } else {
                DB.ref('kolo_msgs/'+cid).push(m);
            }
            i.value = '';
        }

        async function deleteMsg(id) {
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            await DB.ref(`kolo_msgs/${cid}/${id}`).remove();
        }
        
        function openChat(nick, av, name) {
            state.activeChat = nick;
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('chat-head-av').src = av;
            document.getElementById('chat-head-name').innerText = name;
            const cid = [state.user.nick, nick].sort().join('_');
            DB.ref('kolo_msgs/'+cid).on('value', s => {
                const area = document.getElementById('messages-area'); area.innerHTML = '';
                if(s.val()) Object.entries(s.val()).forEach(([id, m]) => {
                    let content = m.text;
                    if(m.type === 'circle') content = `<video src="${m.text}" autoplay loop muted playsinline></video>`;
                    const cls = m.type === 'circle' ? 'video-note' : 'chat-bubble';
                    area.innerHTML += `<div class="${m.sender === state.user.nick ? 'self-end' : 'self-start'} ${cls} ${m.sender === state.user.nick ? 'me' : 'them'}">
                        ${content}
                        <button class="msg-del-btn" onclick="deleteMsg('${id}')">X</button>
                    </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }
    </script>
</body>
</html>
