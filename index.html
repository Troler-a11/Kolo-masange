<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO | PRO CORE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #6366f1; --bg: #000000; --surface: #111111; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; height: 100vh; }
        
        .kolo-card { background: var(--surface); border: 1px solid #222; border-radius: 28px; }
        .input-field { background: #1a1a1a; border: 1.5px solid #333; border-radius: 18px; padding: 16px; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
        
        .btn-primary { background: var(--accent); color: white; font-weight: 800; border-radius: 20px; padding: 18px; width: 100%; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.96); }

        .hidden { display: none !important; }
        .chat-gradient { background: linear-gradient(180deg, rgba(99, 102, 241, 0.05) 0%, rgba(0,0,0,0) 100%); }
        
        /* Скролл */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes slide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-ui { animation: slide 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <div id="auth-screen" class="fixed inset-0 z-[9999] bg-black p-8 flex flex-col justify-center overflow-y-auto">
        <div id="auth-init" class="space-y-6 max-w-md mx-auto w-full animate-ui">
            <div class="text-center mb-10">
                <h1 class="text-5xl font-black italic tracking-tighter">KOLO<span class="text-indigo-500">.</span></h1>
                <p class="text-gray-500 text-[10px] uppercase tracking-[0.5em] mt-3 font-bold">Encrypted Communication</p>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <input type="tel" id="auth-phone" placeholder="+380 00 000 0000" class="input-field text-lg text-center tracking-wider">
                    <div class="absolute -top-3 left-4 bg-black px-2 text-[10px] text-indigo-500 font-black">MOBILE ID</div>
                </div>
                <button onclick="checkUserAndSendOTP()" id="main-auth-btn" class="btn-primary">ПРОДОВЖИТИ</button>
            </div>
            <p class="text-center text-[10px] text-gray-600 uppercase font-bold">Система автоматично визначить ваш статус</p>
        </div>

        <div id="reg-details" class="hidden space-y-4 max-w-md mx-auto w-full animate-ui">
            <h2 class="text-xl font-black text-center mb-4">НОВИЙ ПРОФІЛЬ</h2>
            <input type="text" id="reg-name" placeholder="Ім'я" class="input-field">
            <input type="text" id="reg-nick" placeholder="@username" class="input-field">
            <input type="email" id="reg-email" placeholder="Email для захисту" class="input-field">
            <button onclick="sendOTP('new')" class="btn-primary">ОТРИМАТИ КОД</button>
        </div>

        <div id="otp-view" class="hidden space-y-8 text-center max-w-md mx-auto w-full animate-ui">
            <div>
                <h2 class="text-2xl font-black italic">ВЕРЕФІКАЦІЯ</h2>
                <p id="otp-info" class="text-gray-500 text-xs mt-2"></p>
            </div>
            <input type="text" id="otp-input" maxlength="6" class="w-full text-center text-6xl font-black bg-transparent border-b-4 border-indigo-500 py-4 outline-none tracking-[0.4em] text-indigo-500">
            <button onclick="verifySession()" class="btn-primary">ПІДТВЕРДИТИ</button>
        </div>
    </div>

    <div id="app-ui" class="hidden h-full flex flex-col chat-gradient">
        <header class="p-6 flex justify-between items-center border-b border-white/5">
            <div>
                <h2 class="text-2xl font-black italic">KOLO<span class="text-indigo-500">.</span></h2>
                <p id="my-nick-display" class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest"></p>
            </div>
            <button onclick="logout()" class="w-12 h-12 rounded-2xl bg-neutral-900 flex items-center justify-center border border-white/5">🚪</button>
        </header>

        <div id="chats-container" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-[11px] font-black text-gray-500 uppercase tracking-widest">Діалоги</h3>
                <button onclick="searchUser()" class="text-indigo-500 text-xs font-bold">+ Новий чат</button>
            </div>
            <div id="chat-items-list" class="space-y-3">
                </div>
        </div>

        <nav class="h-24 bg-black/80 backdrop-blur-2xl border-t border-white/5 flex justify-around items-center px-8">
            <button class="text-indigo-500 flex flex-col items-center gap-1">
                <span class="text-2xl">💬</span>
                <span class="text-[8px] font-black uppercase">Чати</span>
            </button>
            <button class="text-gray-600 flex flex-col items-center gap-1">
                <span class="text-2xl">👥</span>
                <span class="text-[8px] font-black uppercase">Друзі</span>
            </button>
            <button class="text-gray-600 flex flex-col items-center gap-1">
                <span class="text-2xl">⚙️</span>
                <span class="text-[8px] font-black uppercase">Опції</span>
            </button>
        </nav>
    </div>

    <script>
        const KOLO_DB_URL = "https://gameshop-ff113-default-rtdb.firebaseio.com/";
        firebase.initializeApp({ databaseURL: KOLO_DB_URL });
        const DB = firebase.database();
        emailjs.init("KErbU8_xE37eaf0qi");

        let state = {
            currentUser: JSON.parse(localStorage.getItem('kolo_v2')) || null,
            tempUser: null,
            otp: null,
            isNew: false
        };

        async function checkUserAndSendOTP() {
            const phone = document.getElementById('auth-phone').value.trim().replace(/\s/g, '');
            if(!/^\+380\d{9}$/.test(phone)) return alert("Формат: +380XXXXXXXXX");

            const snap = await DB.ref('kolo_users').once('value');
            const users = snap.val();
            let found = null;

            if(users) {
                for(let id in users) { if(users[id].phone === phone) found = users[id]; }
            }

            if(found) {
                state.isNew = false;
                state.tempUser = found;
                sendOTP('login');
            } else {
                state.isNew = true;
                document.getElementById('auth-init').classList.add('hidden');
                document.getElementById('reg-details').classList.remove('hidden');
            }
        }

        async function sendOTP(mode) {
            const email = mode === 'login' ? state.tempUser.email : document.getElementById('reg-email').value;
            state.otp = Math.floor(100000 + Math.random() * 900000).toString();

            emailjs.send('service_dbkrnz9', 'template_n90xvc9', {
                to_email: email,
                otp_code: `ВЕРИФІКАЦІЯ: Ваш код KOLO — ${state.otp}. Захист активовано.`
            }).then(() => {
                document.getElementById('auth-init').classList.add('hidden');
                document.getElementById('reg-details').classList.add('hidden');
                document.getElementById('otp-view').classList.remove('hidden');
                document.getElementById('otp-info').innerText = `Код надіслано власнику на ${email}`;
            });
        }

        async function verifySession() {
            if(document.getElementById('otp-input').value === state.otp) {
                if(state.isNew) {
                    const newUser = {
                        name: document.getElementById('reg-name').value,
                        nick: document.getElementById('reg-nick').value.replace('@',''),
                        email: document.getElementById('reg-email').value,
                        phone: document.getElementById('auth-phone').value.replace(/\s/g, ''),
                        avatar: "https://api.dicebear.com/7.x/pixel-art/svg?seed=" + Date.now(),
                        verified: true
                    };
                    await DB.ref('kolo_users/' + newUser.nick).set(newUser);
                    state.currentUser = newUser;
                } else {
                    state.currentUser = state.tempUser;
                }
                localStorage.setItem('kolo_v2', JSON.stringify(state.currentUser));
                location.reload();
            } else alert("Код невірний!");
        }

        function logout() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            if(state.currentUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                document.getElementById('my-nick-display').innerText = "@" + state.currentUser.nick;
            }
        };
    </script>
</body>
</html>
