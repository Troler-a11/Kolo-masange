<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO | FULL VERSION</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #00e5ff; --bg: #000; --surface: #111; --bubble-me: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); --green-tick: #00ff88; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; height: 100vh; }
        
        .side-menu { transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        .side-menu.active { transform: translateX(0); }
        
        .profile-banner { width: 100%; height: 180px; object-fit: cover; border-radius: 0 0 35px 35px; background: #222; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--bg); margin-top: -60px; object-fit: cover; background: #333; }
        
        .chat-bubble { max-width: 80%; padding: 12px 18px; border-radius: 22px; font-size: 14px; font-weight: 600; margin-bottom: 8px; animation: slideUp 0.3s ease; cursor: pointer; position: relative; word-wrap: break-word; }
        .me { background: var(--bubble-me); color: black; align-self: flex-end; border-bottom-right-radius: 4px; }
        .them { background: #222; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }

        .video-note { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); background: #000; flex-shrink: 0; margin-bottom: 10px; position: relative; cursor: pointer; box-shadow: 0 0 15px rgba(0,229,255,0.2); transition: 0.3s; }
        .video-note video { width: 100%; height: 100%; object-fit: cover; }
        .video-note.fullscreen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5000; width: 85vw; height: 85vw; max-width: 320px; max-height: 320px; border-radius: 50%; box-shadow: 0 0 100px rgba(0,0,0,0.9); border-width: 4px; }

        .record-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-blur: 10px; z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .record-circle { width: 280px; height: 280px; border-radius: 50%; border: 5px solid var(--accent); overflow: hidden; position: relative; margin-bottom: 30px; box-shadow: 0 0 50px var(--accent); }
        .record-circle video { width: 100%; height: 100%; object-fit: cover; }

        .story-circle { width: 65px; height: 65px; border-radius: 50%; padding: 3px; border: 2px solid var(--accent); flex-shrink: 0; cursor: pointer; transition: 0.2s; }
        .story-circle:active { transform: scale(0.9); }
        .story-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid black; }

        .story-viewer { fixed: inset 0; z-index: 6000; background: black; display: none; flex-direction: column; }
        .story-progress { display: flex; gap: 2px; padding: 10px; position: absolute; top: 0; width: 100%; z-index: 10; }
        .progress-bar { height: 2px; background: rgba(255,255,255,0.3); flex: 1; overflow: hidden; }
        .progress-fill { height: 100%; background: white; width: 0%; transition: width linear; }

        .input-field { background: #1a1a1a; border: 1.5px solid #333; border-radius: 18px; padding: 16px; width: 100%; color: white; outline: none; }
        .btn-primary { background: var(--accent); color: black; font-weight: 800; border-radius: 20px; padding: 18px; width: 100%; }

        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-menu { position: fixed; background: #222; border-radius: 15px; padding: 8px; z-index: 5000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #444; }
        .custom-menu button { display: block; width: 100%; text-align: left; padding: 10px 20px; color: white; font-weight: bold; font-size: 14px; }
        .custom-menu button.del { color: #ff4444; }

        .voice-bubble { display: flex; align-items: center; gap: 10px; min-width: 150px; }
        .wave-icon { width: 24px; height: 24px; fill: currentColor; }

        .story-controls { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify: center; gap: 20px; z-index: 100; }
        .story-btn { background: rgba(255,255,255,0.2); backdrop-blur: 10px; padding: 15px; border-radius: 50%; font-size: 20px; }
        
        .profile-story-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .profile-story-item { aspect-ratio: 9/16; background: #111; border-radius: 15px; overflow: hidden; position: relative; border: 1px solid #222; }

        .forward-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 7000; display: none; flex-direction: column; padding: 20px; }
        
        .msg-status-tick { font-size: 10px; margin-left: 6px; font-weight: 900; opacity: 0.7; }
        .tick-gray { color: #555; }
        .tick-green { color: var(--green-tick); text-shadow: 0 0 5px rgba(0,255,136,0.3); }
        
        .unread-badge { background: var(--accent); color: black; font-size: 10px; padding: 2px 6px; border-radius: 10px; min-width: 20px; text-align: center; font-weight: 900; }

        .pinned-bar { background: rgba(20,20,20,0.9); backdrop-blur: 10px; padding: 8px 20px; border-bottom: 1px solid #333; display: none; align-items: center; gap: 12px; cursor: pointer; }
        .msg-time { font-size: 9px; opacity: 0.5; margin-bottom: 2px; display: block; }
        .reaction-bar { display: flex; gap: 5px; margin-top: 4px; }
        .reaction-item { font-size: 12px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 10px; }
        
        .pinned-count-badge { background: var(--accent); color: black; font-size: 8px; padding: 1px 4px; border-radius: 4px; margin-left: 5px; font-weight: 900; }
    </style>
</head>
<body>

    <div id="forward-modal" class="forward-modal">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-black">ПЕРЕСЛАТИ</h2>
            <button onclick="closeForward()" class="text-2xl">✕</button>
        </div>
        <div id="forward-list" class="space-y-3 overflow-y-auto"></div>
    </div>

    <div id="story-viewer" class="fixed inset-0 z-[6000] bg-black hidden flex flex-col">
        <div class="story-progress" id="story-progress-container"></div>
        <div class="flex items-center p-4 absolute top-4 left-0 right-0 z-20">
            <img id="story-owner-av" class="w-10 h-10 rounded-full border-2 border-cyan-400 mr-3">
            <span id="story-owner-name" class="font-bold text-sm"></span>
            <button onclick="closeStories()" class="ml-auto text-3xl">✕</button>
        </div>
        <div id="story-content" class="flex-1 flex items-center justify-center overflow-hidden" onclick="handleStoryClick(event)"></div>
        <div class="story-controls">
            <button onclick="likeStory()" class="story-btn">❤️ <span id="story-likes">0</span></button>
            <button id="story-del-btn" onclick="deleteMyStory()" class="story-btn hidden">🗑️</button>
            <button onclick="dislikeStory()" class="story-btn">👎</button>
        </div>
    </div>

    <div id="record-ui" class="record-overlay">
        <div class="record-circle" id="rec-preview-container">
            <video id="record-preview" autoplay muted playsinline></video>
            <div id="audio-visual" class="hidden flex items-center justify-center h-full">
                <div class="w-20 h-20 bg-cyan-400 rounded-full animate-pulse flex items-center justify-center">🎤</div>
            </div>
        </div>
        <div class="text-center">
            <p id="rec-timer" class="text-2xl font-black mb-4">00:00</p>
            <div class="flex gap-6">
                <button onclick="stopRecording(false)" class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-2xl">✕</button>
                <button onclick="stopRecording(true)" class="w-20 h-20 bg-cyan-400 rounded-full flex items-center justify-center text-black text-3xl">➤</button>
            </div>
            <p id="rec-status-label" class="mt-6 text-gray-400 font-bold uppercase tracking-widest text-xs"></p>
        </div>
    </div>

    <div id="msg-context-menu" class="custom-menu">
        <button onclick="copyMsgText()">Скопіювати</button>
        <button onclick="openForward()">Переслати</button>
        <button id="pin-btn-action" onclick="pinMessage()">Закріпити</button>
        <button id="unpin-btn-action" onclick="unpinSpecificMessage()" class="hidden">Відкріпити</button>
        <div class="flex gap-2 p-2 border-t border-white/5">
            <button onclick="addReaction('❤️')">❤️</button>
            <button onclick="addReaction('🔥')">🔥</button>
            <button onclick="addReaction('😂')">😂</button>
        </div>
        <button class="del" onclick="handleDeleteMsg()">Видалити для всіх</button>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[2000] bg-black p-8 flex flex-col justify-center overflow-y-auto">
        <div id="auth-init" class="space-y-6 max-w-md mx-auto w-full text-center">
            <h1 class="text-5xl font-black italic tracking-tighter mb-10">KOLO<span class="text-cyan-400">.</span></h1>
            <input type="tel" id="auth-phone" placeholder="+380XXXXXXXXX" class="input-field text-center">
            <button onclick="checkUserAndSendOTP()" class="btn-primary">ПРОДОВЖИТИ</button>
        </div>
        <div id="reg-details" class="hidden space-y-4 max-w-md mx-auto w-full">
            <h2 class="text-xl font-black text-center mb-6">РЕЄСТРАЦІЯ</h2>
            <input type="text" id="reg-name" placeholder="Ім'я" class="input-field" maxlength="16">
            <input type="text" id="reg-nick" placeholder="@username" class="input-field">
            <input type="email" id="reg-email" placeholder="Email для коду" class="input-field">
            <input type="date" id="reg-bday" class="input-field">
            <button onclick="sendOTP('new')" class="btn-primary">ОТРИМАТИ КОД</button>
        </div>
        <div id="otp-view" class="hidden space-y-8 text-center max-w-md mx-auto w-full">
            <h2 class="text-3xl font-black">ВВЕДІТЬ КОД</h2>
            <input type="text" id="otp-input" maxlength="6" class="w-full text-center text-6xl font-black bg-transparent border-b-4 border-cyan-400 outline-none text-cyan-400 tracking-widest">
            <button onclick="verifySession()" class="btn-primary">ПІДТВЕРДИТИ</button>
        </div>
    </div>

    <div id="side-menu" class="fixed inset-0 side-menu">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="toggleMenu()"></div>
        <div class="relative w-4/5 h-full bg-[#0a0a0a] p-8 border-r border-white/5 flex flex-col">
            <div class="flex flex-col gap-4 mb-10 pb-6 border-b border-white/5" onclick="viewMyProfile(); toggleMenu()">
                <img id="menu-avatar" class="w-16 h-16 rounded-full object-cover border-2 border-cyan-400">
                <div><h3 id="menu-name" class="font-black italic"></h3><p id="menu-nick" class="text-cyan-400 text-xs"></p></div>
            </div>
            <nav class="space-y-6 flex-1">
                <button onclick="viewMyProfile(); toggleMenu()" class="block w-full text-left font-bold">👤 Мій профіль</button>
                <button onclick="document.getElementById('file-story').click(); toggleMenu()" class="block w-full text-left font-bold">📸 Додати історію</button>
            </nav>
            <div class="space-y-4 pt-6 border-t border-white/5">
                <button onclick="logout()" class="block w-full text-left font-bold text-red-500">🚪 Вийти</button>
            </div>
        </div>
    </div>

    <div id="app-ui" class="hidden h-full flex flex-col">
        <header class="p-6 flex justify-between items-center border-b border-white/5 bg-black/80 backdrop-blur-lg">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="text-2xl">☰</button>
                <h2 class="text-2xl font-black italic">KOLO</h2>
            </div>
            <button onclick="toggleSearch(true)" class="text-xl">🔍</button>
        </header>
        <div class="flex gap-4 p-4 overflow-x-auto no-scrollbar border-b border-white/5">
            <div class="flex flex-col items-center gap-1" onclick="document.getElementById('file-story').click()">
                <div class="story-circle" style="border-color: #333; border-style: dashed;"><span class="flex items-center justify-center h-full text-2xl">+</span></div>
                <span class="text-[9px] font-bold text-gray-500">Ваша</span>
                <input type="file" id="file-story" class="hidden" accept="image/*,video/*" onchange="uploadStory(this)">
            </div>
            <div id="stories-list" class="flex gap-4"></div>
        </div>
        <div id="chats-list" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar"></div>
        <button onclick="toggleSearch(true)" class="fixed bottom-28 right-6 w-14 h-14 bg-cyan-400 rounded-full flex items-center justify-center text-black shadow-lg shadow-cyan-400/30">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
        <nav class="h-24 bg-black/90 border-t border-white/5 flex justify-around items-center px-6">
            <button onclick="location.reload()" class="text-cyan-400 flex flex-col items-center"><span class="text-2xl">💬</span><span class="text-[8px] font-black uppercase">Chats</span></button>
            <button onclick="viewMyProfile()" class="text-gray-600 flex flex-col items-center"><span class="text-2xl">👤</span><span class="text-[8px] font-black uppercase">Profile</span></button>
        </nav>
    </div>

    <div id="search-panel" class="hidden fixed inset-0 z-[1500] bg-black p-6 flex flex-col">
        <div class="flex items-center gap-4 mb-8">
            <button onclick="toggleSearch(false)" class="text-2xl">←</button>
            <input type="text" id="search-input" oninput="searchUsers(this.value)" placeholder="Пошук за нікнеймом..." class="input-field flex-1">
        </div>
        <div id="search-results" class="space-y-4 overflow-y-auto flex-1 no-scrollbar"></div>
    </div>

    <div id="chat-window" class="hidden fixed inset-0 z-[1600] bg-black flex flex-col">
        <header class="p-6 bg-black border-b border-white/5 flex items-center gap-4">
            <button onclick="closeChat()" class="text-cyan-400 text-2xl">←</button>
            <img id="chat-head-av" class="w-10 h-10 rounded-full object-cover" onclick="viewForeignProfile(state.activeChat)">
            <div class="flex-1" onclick="viewForeignProfile(state.activeChat)"><h3 id="chat-head-name" class="font-black text-sm"></h3><p id="chat-status" class="text-[9px] text-cyan-500">OFFLINE</p></div>
            <button onclick="cleanOldMessages()" class="text-red-500 text-[10px] font-black border border-red-500/30 px-2 py-1 rounded">CLEAN OLD</button>
            <button onclick="deleteFullChat()" class="text-red-500 text-[10px] font-black">CLEAR</button>
        </header>
        <div id="pinned-msg-bar" class="pinned-bar" onclick="cyclePinnedMessages()">
            <div class="w-1 h-6 bg-cyan-400 rounded-full"></div>
            <div class="flex-1 overflow-hidden">
                <p class="text-[9px] font-black text-cyan-400 uppercase">Закріплене <span id="pinned-idx">1</span>/<span id="pinned-total">1</span></p>
                <p id="pinned-msg-preview" class="text-xs truncate opacity-70"></p>
            </div>
            <button onclick="event.stopPropagation(); unpinCurrentMessage()" class="text-lg opacity-50">✕</button>
        </div>
        <div id="messages-area" class="flex-1 overflow-y-auto p-6 flex flex-col no-scrollbar" onclick="hideMenu()"></div>
        <footer class="p-4 bg-black border-t border-white/5 flex flex-col gap-3">
            <div class="flex gap-2 items-center">
                <button id="rec-btn" onclick="startRecording('video')" class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><circle cx="12" cy="12" r="5"/></svg>
                </button>
                <button onclick="startRecording('audio')" class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button onclick="document.getElementById('chat-file').click()" class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="chat-file" class="hidden" accept="image/*,video/*" onchange="uploadChatFile(this)">
                <input type="text" id="msg-input" placeholder="Повідомлення..." class="flex-1 input-field" oninput="updateStatus('пише...')">
                <button onclick="sendMsg()" class="w-14 h-12 bg-cyan-400 rounded-2xl flex items-center justify-center text-black font-black">
                     <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <div id="profile-page" class="hidden fixed inset-0 z-[1700] bg-black overflow-y-auto no-scrollbar">
        <button onclick="togglePage('profile', false)" class="fixed top-6 left-6 z-50 w-10 h-10 bg-black/50 rounded-full flex items-center justify-center">←</button>
        <div class="relative">
            <img id="p-banner" class="profile-banner" src="https://images.unsplash.com/photo-1557683316-973673baf926">
            <input type="file" id="file-banner" class="hidden" onchange="uploadMedia(this, 'banner')">
            <button id="p-edit-banner" onclick="document.getElementById('file-banner').click()" class="absolute bottom-4 right-4 bg-black/50 p-2 rounded-full">📷</button>
        </div>
        <div class="flex flex-col items-center px-8 pb-20">
            <div class="relative">
                <img id="p-avatar" class="profile-avatar">
                <input type="file" id="file-avatar" class="hidden" onchange="uploadMedia(this, 'avatar')">
                <button id="p-edit-avatar" onclick="document.getElementById('file-avatar').click()" class="absolute bottom-2 right-2 bg-cyan-400 p-2 rounded-full text-black text-xs">✎</button>
            </div>
            
            <input type="text" id="p-name-input" class="text-3xl font-black italic mt-4 bg-transparent border-b border-white/10 text-center outline-none w-full">
            
            <div id="p-friend-status" class="hidden mt-4">
                <button onclick="toggleFriend()" id="btn-friend" class="btn-primary py-2 px-6 text-xs w-auto">СТАТИ ДРУЗЯМИ</button>
                <button onclick="startChatFromProfile()" class="btn-primary py-2 px-6 text-xs w-auto bg-white ml-2">MESSAGE</button>
            </div>

            <div class="w-full mt-10 space-y-4">
                <div class="p-6 bg-[#111] rounded-[28px] space-y-4">
                    <div><p id="p-last-seen-status" class="text-[10px] text-cyan-400 font-bold mb-1"></p><p id="p-phone" class="font-bold text-gray-400"></p><p class="text-[9px] text-gray-600 font-black">MOBILE / INFO</p></div>
                    <div><p id="p-nick-full" class="font-bold text-cyan-400"></p><p class="text-[9px] text-gray-600 font-black">USERNAME / ID</p></div>
                    <div id="p-bio-container">
                        <input type="text" id="p-bio-input" placeholder="..." class="font-bold bg-transparent outline-none w-full border-b border-white/5">
                        <p class="text-[9px] text-gray-600 font-black">BIO</p>
                    </div>
                    <div id="p-bday-container">
                        <div class="flex items-center gap-2">
                             <input type="date" id="p-bday-input" class="font-bold bg-transparent outline-none flex-1">
                             <span id="p-age-calc" class="text-cyan-400 font-black text-xs"></span>
                        </div>
                        <p class="text-[9px] text-gray-600 font-black">BIRTHDAY</p>
                    </div>
                </div>

                <div id="p-stories-section" class="pt-6 border-t border-white/5">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-black text-xs text-gray-500 uppercase">Історії користувача</h4>
                        <button onclick="document.getElementById('file-story').click()" class="text-cyan-400 font-black text-[10px]">+ ДОДАТИ</button>
                    </div>
                    <div id="p-my-stories" class="profile-story-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const KOLO_CONFIG = { databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(KOLO_CONFIG);
        const DB = firebase.database();
        emailjs.init("KErbU8_xE37eaf0qi");

        let state = { 
            user: JSON.parse(localStorage.getItem('kolo_v2')), 
            activeChat: null, 
            isRecording: false, 
            mediaRecorder: null, 
            chunks: [], 
            otp: null, 
            temp: null, 
            viewingNick: null,
            timerInterval: null,
            selectedMsgId: null,
            selectedMsgText: null,
            selectedMsgType: null,
            storyQueue: [],
            currentStoryIndex: 0,
            storyTimer: null,
            pinnedMessages: [],
            activePinnedIndex: 0
        };

        function calculateAge(birthday) {
            if(!birthday) return "0 років";
            const diff = Date.now() - new Date(birthday).getTime();
            return Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25)) + " років";
        }

        function formatMsgDate(ts) {
            const d = new Date(ts);
            const now = new Date();
            const time = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
            if(d.toDateString() === now.toDateString()) return time;
            const months = ["січ", "лют", "бер", "квіт", "трав", "черв", "лип", "серп", "вер", "жовт", "лист", "груд"];
            return time + " " + d.getDate() + " " + months[d.getMonth()];
        }

        function formatTimeAgo(timestamp) {
            if(!timestamp) return "Давно був";
            const diff = Date.now() - timestamp;
            if(diff < 60000) return "В мережі";
            const mins = Math.floor(diff / 60000);
            if(mins < 60) return `Був ${mins} хв тому`;
            const hours = Math.floor(mins / 60);
            if(hours < 24) return `Був ${hours} год тому`;
            return "Був нещодавно";
        }

        async function startRecording(type) {
            const overlay = document.getElementById('record-ui');
            const preview = document.getElementById('record-preview');
            const visual = document.getElementById('audio-visual');
            const label = document.getElementById('rec-status-label');
            
            document.getElementById('rec-timer').innerText = "00:00";
            label.innerText = type === 'video' ? "Запис відео-послання" : "Запис аудіо";
            updateStatus(type === 'video' ? 'записує кружечок...' : 'записує голос...');

            try {
                const constraints = type === 'video' ? { video: { width: 480, height: 480 }, audio: true } : { audio: true };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                if(type === 'video') { preview.srcObject = stream; preview.classList.remove('hidden'); visual.classList.add('hidden'); }
                else { preview.classList.add('hidden'); visual.classList.remove('hidden'); }
                
                overlay.style.display = 'flex';
                state.mediaRecorder = new MediaRecorder(stream);
                state.chunks = [];
                state.mediaRecorder.ondataavailable = e => { if(e.data.size > 0) state.chunks.push(e.data); };
                state.mediaRecorder.start();
                
                let sec = 0;
                state.timerInterval = setInterval(() => {
                    sec++;
                    let s = sec.toString().padStart(2, '0');
                    document.getElementById('rec-timer').innerText = `00:${s}`;
                    if(sec >= 25) stopRecording(true);
                }, 1000);
            } catch(e) { alert("Доступ заборонено"); }
        }

        function stopRecording(send) {
            clearInterval(state.timerInterval);
            if (!state.mediaRecorder) return;
            const isVideo = state.mediaRecorder.stream.getVideoTracks().length > 0;
            const type = isVideo ? 'circle' : 'audio';
            
            state.mediaRecorder.onstop = () => {
                if(send && state.chunks.length > 0) {
                    const blob = new Blob(state.chunks, { type: isVideo ? 'video/mp4' : 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => sendMedia(reader.result, type);
                    reader.readAsDataURL(blob);
                }
                state.mediaRecorder.stream.getTracks().forEach(t => t.stop());
                updateStatus('в мережі');
            };
            state.mediaRecorder.stop();
            document.getElementById('record-ui').style.display = 'none';
        }

        function showStory() {
            const story = state.storyQueue[state.currentStoryIndex];
            const viewer = document.getElementById('story-viewer');
            const content = document.getElementById('story-content');
            viewer.classList.remove('hidden');
            content.innerHTML = story.type === 'video' ? `<video src="${story.src}" autoplay playsinline class="max-h-full"></video>` : `<img src="${story.src}" class="max-w-full max-h-full object-contain">`;
            
            document.getElementById('story-owner-av').src = story.ownerAv;
            document.getElementById('story-owner-name').innerText = story.owner;
            document.getElementById('story-likes').innerText = story.likes || 0;
            
            document.getElementById('story-del-btn').classList.toggle('hidden', story.owner !== state.user.nick);

            const progressContainer = document.getElementById('story-progress-container');
            progressContainer.innerHTML = '';
            state.storyQueue.forEach((_, i) => {
                const bar = document.createElement('div'); bar.className = 'progress-bar';
                const fill = document.createElement('div'); fill.className = 'progress-fill';
                if(i < state.currentStoryIndex) fill.style.width = '100%';
                bar.appendChild(fill); progressContainer.appendChild(bar);
            });

            clearTimeout(state.storyTimer);
            const activeFill = progressContainer.children[state.currentStoryIndex].firstChild;
            setTimeout(() => activeFill.style.width = '100%', 50);
            activeFill.style.transitionDuration = '5s';

            state.storyTimer = setTimeout(() => {
                if(state.currentStoryIndex < state.storyQueue.length - 1) { state.currentStoryIndex++; showStory(); } 
                else closeStories();
            }, 5000);
        }

        function handleStoryClick(e) {

            if (x < w/3) { if(state.currentStoryIndex > 0) { state.currentStoryIndex--; showStory(); } }

            if(isF) { await DB.ref(`kolo_users/${state.user.nick}/friends/${t}`).remove(); await DB.ref(`kolo_users/${t}/friends/${state.user.nick}`).remove(); delete state.user.friends[t]; }
            else { await DB.ref(`kolo_users/${state.user.nick}/friends/${t}`).set(true); await DB.ref(`kolo_users/${t}/friends/${state.user.nick}`).set(true); if(!state.user.friends) state.user.friends = {}; state.user.friends[t] = true; }
            localStorage.setItem('kolo_v2', JSON.stringify(state.user));
            viewForeignProfile(t);
        }

        function uploadMedia(input, type) {
            const reader = new FileReader();
            reader.onload = async () => {
                await DB.ref('kolo_users/'+state.user.nick).update({ [type]: reader.result });
                state.user[type] = reader.result;
                localStorage.setItem('kolo_v2', JSON.stringify(state.user));
                renderProfile(state.user);
            };
            reader.readAsDataURL(input.files[0]);
        }

        async function deleteFullChat() {
            if(!confirm("Очистити всю історію повідомлень?")) return;
            const cid = [state.user.nick, state.activeChat].sort().join('_');
            await DB.ref(`kolo_msgs/${cid}`).remove();
        }

        function viewMyProfile() { togglePage('profile', true); state.viewingNick = state.user.nick; document.getElementById('p-edit-banner').classList.remove('hidden'); document.getElementById('p-edit-avatar').classList.remove('hidden'); document.getElementById('p-name-input').readOnly = false; document.getElementById('p-bio-input').readOnly = false; document.getElementById('p-bday-input').readOnly = false; document.getElementById('p-friend-status').classList.add('hidden'); renderProfile(state.user); }

        async function viewForeignProfile(nick) { togglePage('profile', true); toggleSearch(false); const snap = await DB.ref('kolo_users/' + nick).once('value'); const u = snap.val(); state.viewingNick = nick; document.getElementById('p-edit-banner').classList.add('hidden'); document.getElementById('p-edit-avatar').classList.add('hidden'); document.getElementById('p-name-input').readOnly = true; document.getElementById('p-bio-input').readOnly = true; document.getElementById('p-bday-input').readOnly = true; document.getElementById('p-friend-status').classList.remove('hidden'); const isFriend = state.user.friends && state.user.friends[nick]; document.getElementById('btn-friend').innerText = isFriend ? "ВИДАЛИТИ" : "ДОДАТИ"; renderProfile(u); }

        function startChatFromProfile() { togglePage('profile', false); openChat(state.viewingNick, document.getElementById('p-avatar').src, document.getElementById('p-name-input').value); }

        window.onclick = hideMenu;

        window.onload = () => {
            if(state.user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                document.getElementById('menu-name').innerText = state.user.name;
                document.getElementById('menu-avatar').src = state.user.avatar;
                document.getElementById('menu-nick').innerText = "@" + state.user.nick;
                initListeners();
                setInterval(() => DB.ref(`kolo_users/${state.user.nick}`).update({ lastSeen: Date.now() }), 30000);
            }
        };

        document.getElementById('p-name-input').onchange = (e) => { 
            const newName = validateAndShortenName(e.target.value);
            e.target.value = newName;
            DB.ref('kolo_users/'+state.user.nick).update({name: newName}); 
            state.user.name = newName; 
            localStorage.setItem('kolo_v2', JSON.stringify(state.user)); 
        };
        document.getElementById('p-bio-input').onchange = (e) => { DB.ref('kolo_users/'+state.user.nick).update({bio: e.target.value}); state.user.bio = e.target.value; localStorage.setItem('kolo_v2', JSON.stringify(state.user)); };
        document.getElementById('p-bday-input').onchange = (e) => { DB.ref('kolo_users/'+state.user.nick).update({bday: e.target.value}); state.user.bday = e.target.value; localStorage.setItem('kolo_v2', JSON.stringify(state.user)); };
    </script>
</body>
</html>
