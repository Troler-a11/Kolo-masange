<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO ZERO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        .bubble { max-width: 80%; padding: 12px; border-radius: 15px; margin: 5px 0; position: relative; }
        .me { background: #00e5ff; color: #000; align-self: flex-end; }
        .them { background: #1a1a1a; align-self: flex-start; }
        .circle { width: 200px; height: 200px; border-radius: 50%; overflow: hidden; border: 3px solid #00e5ff; position: relative; margin: 10px 0; }
        .circle video { width: 100%; height: 100%; object-fit: cover; }
        .del { position: absolute; top: -5px; right: -5px; background: red; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 5; border: 1px solid #000; }
        .rec-ui { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .btn-send { background: #00e5ff; color: #000; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth" class="fixed inset-0 bg-black z-[200] flex flex-col items-center justify-center p-6 text-center">
    <h1 class="text-4xl font-bold mb-8">KOLO ZERO</h1>
    <input type="text" id="nick" placeholder="Твій нік" class="bg-zinc-900 p-4 rounded-xl w-full mb-4 outline-none">
    <button onclick="login()" class="btn-send w-full">ПОЧАТИ</button>
</div>

<div id="app" class="hidden h-full flex flex-col">
    <div id="list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    <div id="chat" class="hidden fixed inset-0 bg-black flex flex-col z-50">
        <div class="p-4 border-b border-zinc-800 flex items-center gap-4">
            <button onclick="closeChat()" class="text-[#00e5ff]">← Назад</button>
            <b id="chat-name"></b>
        </div>
        <div id="msgs" class="flex-1 overflow-y-auto p-4 flex flex-col bg-[#050505]"></div>
        <div class="p-3 border-t border-zinc-800 flex gap-2 items-center">
            <button onclick="startRec()" class="text-2xl">🔘</button>
            <input type="text" id="m-in" placeholder="Повідомлення..." class="flex-1 bg-zinc-900 p-3 rounded-xl outline-none">
            <button onclick="sendMsg()" class="btn-send">ВІДПРАВИТИ</button>
        </div>
    </div>
</div>

<div id="rec-box" class="rec-ui">
    <video id="v-pre" autoplay muted playsinline class="w-64 h-64 rounded-full border-4 border-[#00e5ff] object-cover mb-8"></video>
    <div class="flex gap-4">
        <button onclick="stopRec(false)" class="p-4 text-gray-500">СКАСУВАТИ</button>
        <button onclick="stopRec(true)" class="btn-send px-8">ГОТОВО</button>
    </div>
</div>

<script>
    firebase.initializeApp({ databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" });
    const db = firebase.database();
    let user = JSON.parse(localStorage.getItem('kolo_z')), active = null, recorder = null, chunks = [];

    function login() {
        const n = document.getElementById('nick').value;
        if(!n) return;
        user = { nick: n };
        localStorage.setItem('kolo_z', JSON.stringify(user));
        location.reload();
    }

    function openChat(n) {
        active = n;
        document.getElementById('chat').classList.remove('hidden');
        document.getElementById('chat-name').innerText = n;
        const cid = [user.nick, n].sort().join('_');
        db.ref('msgs/'+cid).on('value', s => {
            const mBox = document.getElementById('msgs');
            mBox.innerHTML = '';
            if(s.val()) Object.entries(s.val()).forEach(([id, m]) => {
                const isMe = m.s === user.nick;
                const cls = isMe ? 'me' : 'them';
                const content = m.t === 'v' ? `<video src="${m.v}" autoplay loop muted playsinline></video>` : m.v;
                mBox.innerHTML += `<div class="${cls} ${m.t==='v'?'circle':'bubble'} flex flex-col">
                    <div class="del" onclick="del('${id}')">×</div>
                    ${content}
                </div>`;
            });
            mBox.scrollTop = mBox.scrollHeight;
        });
    }

    async function sendMsg() {
        const i = document.getElementById('m-in');
        if(!i.value) return;
        const cid = [user.nick, active].sort().join('_');
        await db.ref('msgs/'+cid).push({ s: user.nick, v: i.value, t: 'txt' });
        i.value = '';
    }

    async function del(id) {
        if(confirm("Видалити?")) {
            const cid = [user.nick, active].sort().join('_');
            await db.ref(`msgs/${cid}/${id}`).remove();
        }
    }

    async function startRec() {
        const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('v-pre').srcObject = s;
        document.getElementById('rec-box').style.display = 'flex';
        recorder = new MediaRecorder(s);
        chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.start();
    }

    function stopRec(save) {
        recorder.onstop = async () => {
            if(save) {
                const b = new Blob(chunks, { type: 'video/mp4' });
                const r = new FileReader();
                r.onload = async () => {
                    const cid = [user.nick, active].sort().join('_');
                    await db.ref('msgs/'+cid).push({ s: user.nick, v: r.result, t: 'v' });
                };
                r.readAsDataURL(b);
            }
            document.getElementById('v-pre').srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('rec-box').style.display = 'none';
        };
        recorder.stop();
    }

    function closeChat() { document.getElementById('chat').classList.add('hidden'); }

    window.onload = () => {
        if(user) {
            document.getElementById('auth').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            db.ref('users').on('value', s => {
                const l = document.getElementById('list');
                l.innerHTML = '<h3 class="p-2 text-zinc-500">Контакти:</h3>';
                s.forEach(c => {
                    if(c.key !== user.nick) l.innerHTML += `<div onclick="openChat('${c.key}')" class="p-4 bg-zinc-900 rounded-xl">${c.key}</div>`;
                });
            });
            db.ref('users/'+user.nick).set({ nick: user.nick });
        }
    }
</script>
</body>
</html>
