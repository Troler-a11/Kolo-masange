<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO | ULTIMATE REPAIR 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #00e5ff; --bg: #000; --surface: #111; --text: #fff; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; }

        /* ЧАТ ТА КРУЖКИ */
        .chat-bubble { max-width: 80%; padding: 15px 20px; border-radius: 25px; font-weight: 600; margin-bottom: 10px; position: relative; }
        .me { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 5px; }
        .them { background: var(--surface); align-self: flex-start; border-bottom-left-radius: 5px; }

        .video-note { width: 260px; height: 260px; border-radius: 50%; overflow: hidden; border: 5px solid var(--accent); position: relative; margin: 10px 0; background: #000; }
        .video-note video { width: 100%; height: 100%; object-fit: cover; }

        /* КНОПКА ВИДАЛЕННЯ - ТЕПЕР ПРАЦЮЄ ВСЮДИ */
        .del-trigger { position: absolute; top: -10px; right: -10px; background: #ff3b30; color: #fff; width: 30px; height: 30px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 900; z-index: 200; border: 2px solid #000; cursor: pointer; }
        .chat-bubble:hover .del-trigger, .video-note:hover .del-trigger { display: flex; }

        /* ВІКНО ЗАПИСУ */
        .rec-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .circle-preview { width: 320px; height: 320px; border-radius: 50%; border: 8px solid var(--accent); overflow: hidden; margin-bottom: 40px; }
        .circle-preview video { width: 100%; height: 100%; object-fit: cover; }

        .btn-send { background: var(--accent); color: #000; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.2s; flex-shrink: 0; }
        .btn-send:active { transform: scale(0.9); }
        
        .side-menu { position: fixed; inset: 0; transform: translateX(-100%); transition: 0.4s; z-index: 5000; }
        .side-menu.active { transform: translateX(0); }
        
        .input-area { background: var(--surface); border-radius: 25px; padding: 15px 20px; width: 100%; color: #fff; outline: none; border: 1px solid rgba(255,255,255,0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="rec-ui" class="rec-overlay">
        <div class="circle-preview"><video id="rec-v" autoplay muted playsinline></video></div>
        <div class="flex gap-10">
            <button onclick="stopRec(false)" class="text-zinc-500 font-black uppercase">Скасувати</button>
            <button onclick="stopRec(true)" class="bg-white text-black px-10 py-4 rounded-full font-black uppercase">Відправити</button>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-black p-10 flex flex-col justify-center">
        <div id="auth-box" class="space-y-8 text-center">
            <h1 class="text-6xl font-black italic">KOLO<span class="text-cyan-400">.</span></h1>
            <input type="tel" id="u-phone" placeholder="0XXXXXXXXX" class="input-area text-center text-2xl font-bold">
            <button onclick="startAuth()" class="w-full py-5 bg-cyan-400 text-black font-black rounded-2xl">УВІЙТИ</button>
        </div>
        <div id="otp-box" class="hidden space-y-8 text-center">
            <h2 class="text-2xl font-black">ВВЕДИ КОД</h2>
            <input type="text" id="otp-code" class="bg-transparent border-b-4 border-cyan-400 text-6xl text-center outline-none font-black tracking-widest w-full">
            <button onclick="checkOTP()" class="w-full py-5 bg-cyan-400 text-black font-black rounded-2xl">ПІДТВЕРДИТИ</button>
        </div>
    </div>

    <div id="main-app" class="hidden h-full flex flex-col">
        <header class="p-6 flex justify-between items-center border-b border-white/5">
            <button onclick="document.getElementById('side').classList.add('active')" class="text-3xl">☰</button>
            <h2 class="text-2xl font-black italic">KOLO</h2>
            <div class="w-10"></div>
        </header>

        <div id="chat-list" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"></div>

        <nav class="h-20 border-t border-white/10 flex justify-around items-center bg-black">
            <button class="text-cyan-400 font-black text-xs">ЧАТИ</button>
            <button onclick="openMyProfile()" class="text-zinc-500 font-black text-xs">ПРОФІЛЬ</button>
        </nav>
    </div>

    <div id="chat-win" class="hidden fixed inset-0 z-[2000] bg-black flex flex-col">
        <header class="p-4 border-b border-white/10 flex items-center gap-4">
            <button onclick="document.getElementById('chat-win').classList.add('hidden')" class="text-3xl text-cyan-400">←</button>
            <img id="cw-av" class="w-12 h-12 rounded-full object-cover">
            <h3 id="cw-name" class="font-black text-lg"></h3>
        </header>

        <div id="msg-box" class="flex-1 overflow-y-auto p-6 flex flex-col no-scrollbar"></div>

        <footer class="p-4 bg-black border-t border-white/10 flex gap-3 items-center">
            <button onclick="startRec()" class="w-14 h-14 bg-zinc-900 rounded-full flex items-center justify-center text-2xl">🔘</button>
            <input type="text" id="m-input" placeholder="Повідомлення..." class="flex-1 bg-zinc-900 p-4 rounded-2xl outline-none font-bold">
            <button onclick="send()" class="btn-send">➤</button>
        </footer>
    </div>

    <div id="side" class="side-menu">
        <div class="absolute inset-0 bg-black/80" onclick="this.parentElement.classList.remove('active')"></div>
        <div class="relative w-4/5 h-full bg-zinc-950 p-10 flex flex-col">
            <h2 class="text-4xl font-black italic mb-20">МЕНЮ</h2>
            <button onclick="location.reload()" class="text-left py-4 font-black text-red-500">ВИЙТИ</button>
        </div>
    </div>

    <script>
        const cfg = { databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(cfg);
        const db = firebase.database();
        emailjs.init("KErbU8_xE37eaf0qi");

        let user = JSON.parse(localStorage.getItem('kolo_v2'));
        let active = null, recorder = null, chunks = [];

        // АВТОРИЗАЦІЯ
        async function startAuth() {
            const p = document.getElementById('u-phone').value;
            const snap = await db.ref('kolo_users').once('value');
            let found = null;
            snap.forEach(c => { if(c.val().phone.includes(p)) found = c.val(); });

            if(found) {
                user = found;
                const otp = Math.floor(1000 + Math.random()*9000).toString();
                user.otp = otp;
                emailjs.send('service_dbkrnz9', 'template_n90xvc9', { to_email: user.email, otp_code: otp });
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('otp-box').classList.remove('hidden');
            } else alert("Юзера не знайдено");
        }

        function checkOTP() {
            if(document.getElementById('otp-code').value === user.otp) {
                localStorage.setItem('kolo_v2', JSON.stringify(user));
                location.reload();
            }
        }

        // ПОВІДОМЛЕННЯ
        function openChat(nick, av, name) {
            active = nick;
            document.getElementById('chat-win').classList.remove('hidden');
            document.getElementById('cw-av').src = av;
            document.getElementById('cw-name').innerText = name;
            loadMsgs();
        }

        function loadMsgs() {
            const cid = [user.nick, active].sort().join('_');
            db.ref('kolo_msgs/'+cid).on('value', s => {
                const box = document.getElementById('msg-box');
                box.innerHTML = '';
                if(s.val()) Object.entries(s.val()).forEach(([id, m]) => {
                    const isMe = m.sender === user.nick;
                    let content = m.type === 'circle' ? `<video src="${m.text}" autoplay loop muted playsinline></video>` : m.text;
                    box.innerHTML += `
                        <div class="${isMe?'self-end':'self-start'} ${m.type==='circle'?'video-note':'chat-bubble'} ${isMe?'me':'them'}">
                            ${content}
                            <div class="del-trigger" onclick="del('${id}')">×</div>
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        async function send() {
            const val = document.getElementById('m-input').value;
            if(!val) return;
            const cid = [user.nick, active].sort().join('_');
            await db.ref('kolo_msgs/'+cid).push({ sender: user.nick, text: val, type: 'text' });
            document.getElementById('m-input').value = '';
        }

        async function del(id) {
            if(confirm("Видалити?")) {
                const cid = [user.nick, active].sort().join('_');
                await db.ref(`kolo_msgs/${cid}/${id}`).remove();
            }
        }

        // КРУЖКИ
        async function startRec() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('rec-v').srcObject = stream;
            document.getElementById('rec-ui').style.display = 'flex';
            recorder = new MediaRecorder(stream);
            chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.start();
        }

        function stopRec(save) {
            recorder.onstop = async () => {
                if(save) {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const r = new FileReader();
                    r.onload = async () => {
                        const cid = [user.nick, active].sort().join('_');
                        await db.ref('kolo_msgs/'+cid).push({ sender: user.nick, text: r.result, type: 'circle' });
                    };
                    r.readAsDataURL(blob);
                }
                document.getElementById('rec-v').srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('rec-ui').style.display = 'none';
            };
            recorder.stop();
        }

        window.onload = () => {
            if(user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                db.ref('kolo_users').once('value', s => {
                    const list = document.getElementById('chat-list');
                    s.forEach(c => {
                        const u = c.val();
                        if(u.nick !== user.nick) {
                            list.innerHTML += `
                                <div onclick="openChat('${u.nick}','${u.avatar}','${u.name}')" class="flex items-center gap-4 p-5 bg-zinc-900 rounded-[30px]">
                                    <img src="${u.avatar}" class="w-14 h-14 rounded-full">
                                    <h4 class="font-black">${u.name}</h4>
                                </div>`;
                        }
                    });
                });
            }
        };
    </script>
</body>
</html>
