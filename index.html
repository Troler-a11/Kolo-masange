<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLO LITE PRO 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --accent: #00e5ff; --bg: #000; --surf: #111; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; height: 100vh; }
        
        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; margin-bottom: 8px; position: relative; font-weight: 500; }
        .me { background: var(--accent); color: #000; align-self: flex-end; }
        .them { background: var(--surf); align-self: flex-start; }

        .video-note { width: 220px; height: 220px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); position: relative; margin: 8px 0; background: #000; flex-shrink: 0; }
        .video-note video { width: 100%; height: 100%; object-fit: cover; }

        /* ВИДАЛЕННЯ */
        .del-btn { position: absolute; top: -5px; right: -5px; background: #ff3b30; color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; z-index: 10; border: 1px solid #000; cursor: pointer; opacity: 0.8; }
        
        .rec-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .circle-pre { width: 280px; height: 280px; border-radius: 50%; border: 5px solid var(--accent); overflow: hidden; margin-bottom: 30px; }
        .circle-pre video { width: 100%; height: 100%; object-fit: cover; }

        .btn-send { background: var(--accent); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; border: none; }
        
        .side-menu { position: fixed; inset: 0; transform: translateX(-100%); transition: 0.3s; z-index: 5000; background: rgba(0,0,0,0.8); }
        .side-menu.active { transform: translateX(0); }
        .menu-content { width: 280px; height: 100%; background: #080808; padding: 40px 20px; }

        .no-scroll::-webkit-scrollbar { display: none; }
        input { background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 12px; }
    </style>
</head>
<body>

    <div id="rec-ui" class="rec-overlay">
        <div class="circle-pre"><video id="rec-v" autoplay muted playsinline></video></div>
        <div class="flex gap-8">
            <button onclick="stopRec(false)" class="text-gray-400 font-bold uppercase">Відміна</button>
            <button onclick="stopRec(true)" class="bg-white text-black px-8 py-3 rounded-full font-bold uppercase">Готово</button>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-black p-10 flex flex-col justify-center">
        <div id="auth-box" class="space-y-6 text-center">
            <h1 class="text-5xl font-black italic">KOLO</h1>
            <input type="tel" id="u-phone" placeholder="0XXXXXXXXX" class="w-full text-center text-xl font-bold">
            <button onclick="startAuth()" class="w-full py-4 bg-cyan-400 text-black font-bold rounded-xl">УВІЙТИ</button>
        </div>
        <div id="otp-box" class="hidden space-y-6 text-center">
            <h2 class="text-xl font-bold">КОД З EMAIL</h2>
            <input type="text" id="otp-code" class="w-full text-center text-4xl font-bold tracking-widest bg-transparent border-b-2 border-cyan-400">
            <button onclick="checkOTP()" class="w-full py-4 bg-cyan-400 text-black font-bold rounded-xl">ПІДТВЕРДИТИ</button>
        </div>
    </div>

    <div id="main-app" class="hidden h-full flex flex-col">
        <header class="p-5 border-b border-zinc-900 flex justify-between items-center bg-black">
            <button onclick="document.getElementById('side').classList.add('active')" class="text-2xl">☰</button>
            <h2 class="font-bold tracking-tighter italic">KOLO</h2>
            <div class="w-8"></div>
        </header>

        <div id="chat-list" class="flex-1 overflow-y-auto p-4 space-y-2 no-scroll"></div>

        <nav class="h-16 border-t border-zinc-900 flex justify-around items-center bg-black">
            <button class="text-cyan-400 text-xs font-bold">ЧАТИ</button>
            <button onclick="alert('Профіль в розробці')" class="text-zinc-600 text-xs font-bold">ПРОФІЛЬ</button>
        </nav>
    </div>

    <div id="chat-win" class="hidden fixed inset-0 z-[2000] bg-black flex flex-col">
        <header class="p-4 border-b border-zinc-900 flex items-center gap-4 bg-black">
            <button onclick="document.getElementById('chat-win').classList.add('hidden')" class="text-2xl text-cyan-400">←</button>
            <img id="cw-av" class="w-10 h-10 rounded-full object-cover">
            <h3 id="cw-name" class="font-bold"></h3>
        </header>

        <div id="msg-box" class="flex-1 overflow-y-auto p-4 flex flex-col no-scroll bg-[#050505]"></div>

        <footer class="p-3 bg-black border-t border-zinc-900 flex gap-2 items-center">
            <button onclick="startRec()" class="w-12 h-12 bg-zinc-900 rounded-full flex items-center justify-center text-xl">🔘</button>
            <input type="text" id="m-input" placeholder="Пиши..." class="flex-1 bg-zinc-900 p-3 rounded-xl outline-none">
            <button onclick="send()" class="btn-send">➤</button>
        </footer>
    </div>

    <div id="side" class="side-menu">
        <div class="menu-content flex flex-col">
            <h2 class="text-3xl font-bold mb-10 italic">KOLO</h2>
            <button onclick="localStorage.clear(); location.reload()" class="text-left text-red-500 font-bold">ВИЙТИ</button>
            <button onclick="document.getElementById('side').classList.remove('active')" class="mt-auto text-zinc-500">Закрити</button>
        </div>
    </div>

    <script>
        const cfg = { databaseURL: "https://gameshop-ff113-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(cfg);
        const db = firebase.database();
        emailjs.init("KErbU8_xE37eaf0qi");

        let user = JSON.parse(localStorage.getItem('kolo_v2'));
        let activeNick = null, recorder = null, chunks = [];

        // АВТОРИЗАЦІЯ
        async function startAuth() {
            const ph = document.getElementById('u-phone').value;
            const s = await db.ref('kolo_users').once('value');
            let found = null;
            s.forEach(c => { if(c.val().phone.includes(ph)) found = c.val(); });

            if(found) {
                user = found;
                user.otp = Math.floor(1000 + Math.random()*9000).toString();
                emailjs.send('service_dbkrnz9', 'template_n90xvc9', { to_email: user.email, otp_code: user.otp });
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('otp-box').classList.remove('hidden');
            } else alert("Не знайдено");
        }

        function checkOTP() {
            if(document.getElementById('otp-code').value === user.otp) {
                localStorage.setItem('kolo_v2', JSON.stringify(user));
                location.reload();
            }
        }

        // ПОВІДОМЛЕННЯ
        function openChat(nick, av, name) {
            activeNick = nick;
            document.getElementById('chat-win').classList.remove('hidden');
            document.getElementById('cw-av').src = av;
            document.getElementById('cw-name').innerText = name;
            
            const cid = [user.nick, activeNick].sort().join('_');
            db.ref('kolo_msgs/'+cid).off();
            db.ref('kolo_msgs/'+cid).on('value', s => {
                const box = document.getElementById('msg-box');
                box.innerHTML = '';
                if(s.val()) Object.entries(s.val()).forEach(([id, m]) => {
                    const isMe = m.sender === user.nick;
                    const type = m.type === 'circle' ? 'video-note' : 'chat-bubble';
                    const content = m.type === 'circle' ? `<video src="${m.text}" autoplay loop muted playsinline></video>` : m.text;
                    box.innerHTML += `
                        <div class="${isMe?'self-end':'self-start'} ${type} ${isMe?'me':'them'}">
                            ${content}
                            <div class="del-btn" onclick="delMsg('${id}')">×</div>
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        async function send() {
            const val = document.getElementById('m-input').value;
            if(!val) return;
            const cid = [user.nick, activeNick].sort().join('_');
            await db.ref('kolo_msgs/'+cid).push({ sender: user.nick, text: val, type: 'text' });
            document.getElementById('m-input').value = '';
        }

        async function delMsg(id) {
            const cid = [user.nick, activeNick].sort().join('_');
            if(confirm("Видалити?")) await db.ref(`kolo_msgs/${cid}/${id}`).remove();
        }

        // КРУЖКИ
        async function startRec() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('rec-v').srcObject = stream;
                document.getElementById('rec-ui').style.display = 'flex';
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.start();
            } catch(e) { alert("Доступ заборонено"); }
        }

        function stopRec(save) {
            recorder.onstop = async () => {
                if(save) {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const r = new FileReader();
                    r.onload = async () => {
                        const cid = [user.nick, activeNick].sort().join('_');
                        await db.ref('kolo_msgs/'+cid).push({ sender: user.nick, text: r.result, type: 'circle' });
                    };
                    r.readAsDataURL(blob);
                }
                document.getElementById('rec-v').srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('rec-ui').style.display = 'none';
            };
            recorder.stop();
        }

        // СТАРТ
        window.onload = () => {
            if(user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                db.ref('kolo_users').once('value', s => {
                    const list = document.getElementById('chat-list');
                    s.forEach(c => {
                        const u = c.val();
                        if(u.nick !== user.nick) {
                            list.innerHTML += `
                                <div onclick="openChat('${u.nick}','${u.avatar}','${u.name}')" class="flex items-center gap-3 p-4 bg-zinc-900 rounded-2xl mb-2">
                                    <img src="${u.avatar}" class="w-12 h-12 rounded-full">
                                    <span class="font-bold">${u.name}</span>
                                </div>`;
                        }
                    });
                });
            }
        };
    </script>
</body>
</html>
